<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PaperBot</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a1a19"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fcfcfb;--card:#ffffff;--ink:#1a1a19;--ink2:#55554f;--mut:#82827c;--line:#e6e6e1;--grid:#eeeeea;--chip:#f1f1ed;
--blue:#2a78d6;--orange:#eb6834;--aqua:#1baf7a;--yellow:#eda100;--mag:#e87ba4;--green:#008300;--violet:#6250d6;--red:#e34948;--good:#0ca30c;--crit:#d03b3b;--warn:#eda100}
:root[data-theme=dark]{--bg:#1a1a19;--card:#222220;--ink:#f2f2ef;--ink2:#b9b9b3;--mut:#8f8f89;--line:#363633;--grid:#2c2c29;--chip:#2c2c29}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1a19;--card:#222220;--ink:#f2f2ef;--ink2:#b9b9b3;--mut:#8f8f89;--line:#363633;--grid:#2c2c29;--chip:#2c2c29}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:10px 12px 40px}
html{overflow-y:scroll;scrollbar-gutter:stable}
.sub{min-height:16px}#banner{min-height:18px}#view{min-height:70vh}
.tabs{margin-top:0}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--ink2);font-size:12px}
.badge{white-space:nowrap;display:inline-block;font-size:10.5px;font-weight:650;letter-spacing:.4px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:baseline;background:var(--mut)}
.dot.on{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}
.ctrl{display:block;margin:4px 0 8px}.ctrl .r1{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}.ctrl .r2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.ctrl .r1::-webkit-scrollbar{display:none}.ctrl button{white-space:nowrap;min-height:32px;padding:5px 10px;font-size:13px}.ctrl .seg{flex:0 0 auto}.ctrl>button{flex:0 0 auto}#banner{font-size:11.5px;color:var(--mut)}#status{font-size:12.5px}
button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;min-height:36px}
button:active{transform:translateY(1px)}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.danger{border-color:var(--crit)}
.seg{display:inline-flex;gap:0}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:9px 0 0 9px;margin-left:0}.seg button:last-child{border-radius:0 9px 9px 0}
.tabs{display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:transparent;padding:7px 9px;font-size:13.5px;border-radius:8px;color:var(--ink2);font-weight:550}
.tabs button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media(min-width:640px){.grid.k3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.card h2{font-size:12px;margin:0 0 6px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.big{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15}
.mid{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.mut{color:var(--mut)}.ink2{color:var(--ink2)}
.up{color:var(--good);font-size:11px}.dn{color:var(--crit);font-size:11px}.fl{color:var(--mut);font-size:11px}
.num{font-variant-numeric:tabular-nums}
.chart{position:relative;width:100%;touch-action:pan-y;user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.18);white-space:nowrap;z-index:4;display:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend i.sq{width:9px;height:9px;border:1.5px solid;border-radius:2px}
.pos{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar{position:relative;height:6px;border-radius:3px;background:var(--grid);margin:8px 0 4px}
.bar b{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--ink)}
.fbar{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.fbar .full{grid-column:1/-1}
.fbar input,.fbar select{width:100%;min-height:36px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:13.5px;font-family:inherit}
.fbar label{font-size:11px;color:var(--mut);display:block;margin-bottom:2px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 2px;font-size:12.5px}
.pager button{min-height:34px;padding:4px 12px}
.sumbar{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:6px 0}
.scroll{overflow-x:auto}
.lwc{position:relative;width:100%;min-height:200px;touch-action:pan-y}
.pill.buy{background:var(--good);color:#fff}.pill.sell{background:var(--crit);color:#fff}
.legrow{font-size:12.5px;margin:3px 0;font-variant-numeric:tabular-nums}
.legrow b.buy{color:var(--good)}.legrow b.sell{color:var(--crit)}
.st{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;border:1px solid var(--line)}
.st.use{background:var(--good);color:#fff;border-color:var(--good)}.st.test{background:var(--yellow);color:#222;border-color:var(--yellow)}.st.rej{background:transparent;color:var(--crit);border-color:var(--crit)}.st.avail{color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;min-height:32px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.agent{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
.agent .nm{font-weight:650;font-size:13px}
.agent .ms{font-size:12px;color:var(--ink2);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.log{margin-top:8px}
.log div{display:flex;gap:7px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:flex-start}
.log .t{color:var(--mut);flex:0 0 52px;font-variant-numeric:tabular-nums;font-size:11.5px;padding-top:1px}
.log .a{flex:0 0 74px;font-weight:600;font-size:12px}
.log .a u{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;text-decoration:none}
.log .m{flex:1;word-break:break-word}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:650;border:1px solid var(--line);background:var(--chip)}
.pill.active{border-color:var(--good)}.pill.shadow{border-color:var(--mut)}.pill.explore{border-color:var(--yellow)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:600;color:var(--ink2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:4px 4px}
td{padding:6px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
.note{font-size:12px;color:var(--ink2);margin:8px 0}
.warnbox{border:1px solid var(--warn);border-radius:10px;padding:8px 10px;font-size:12.5px;background:var(--card);margin:8px 0}
.crit{border-color:var(--crit)}
ul.tight{margin:6px 0;padding-left:18px}ul.tight li{margin:3px 0}
.empty{color:var(--mut);padding:10px 2px;font-size:13px}
.trade{border-top:1px solid var(--line);padding:8px 0}
footer{color:var(--mut);font-size:11.5px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>PaperBot <span class="mut" style="font-weight:400">· adaptive</span></h1>
      <div class="sub" id="status">starting…</div>
    </div>
    <div style="text-align:right"><span class="badge" id="badge">PAPER MONEY</span><div style="margin-top:6px"><button id="theme" title="Theme" style="padding:3px 9px;min-height:28px">◐</button> <button id="install" title="Install as an app" style="padding:3px 9px;min-height:28px;display:none;white-space:nowrap">Install</button></div></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="note" id="banner" style="margin:6px 0 6px"></div>
  <div class="ctrl" id="ctrl"></div>
  <div id="view"></div>
  <footer>Educational simulation. Paper money only — not financial advice. Past or simulated results do not predict real trading results.<br>Charts: <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts™</a> (Apache-2.0). Copyright © TradingView, Inc.</footer>
</div>
<script>window.__SERVER__=true;</script>
<script src="vendor/lightweight-charts.js"></script><script></script>
<script>window.__IND__=null;</script>
<script>
(function(){
'use strict';
var SERVER=window.__SERVER__;
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var CUR='$';
var usd=function(x,sign){return (x<0?'−'+CUR:(sign&&x>0?'+'+CUR:CUR))+Math.abs(x).toFixed(2)};
var pct=function(x,d,sign){return (x<0?'−':(sign&&x>0?'+':''))+Math.abs(x*100).toFixed(d==null?1:d)+'%'};
var sg=function(x,d){return (x>=0?'+':'−')+Math.abs(x).toFixed(d==null?2:d)};
var fmtP=function(p){return p>=1000?p.toFixed(1):p>=100?p.toFixed(2):p>=1?p.toFixed(3):p.toFixed(5)};
var arrow=function(x){return x>0.00001?'<span class="up">▲</span>':x<-0.00001?'<span class="dn">▼</span>':'<span class="fl">■</span>'};
var hhmmss=function(ts){var d=new Date(ts);return d.toTimeString().slice(0,8)};
var AGENT_COL={Supervisor:'#2a78d6',Data:'#eb6834',Analyst:'#1baf7a',Strategy:'#eda100',Learner:'#e87ba4',Risk:'#008300',Executor:'#6250d6',Reporter:'#e34948'};
var LV={trade:'●',signal:'◆',warn:'▲',risk:'■',learn:'✦',critical:'✖',info:'·'};
var STRAT={trend:'Trend (EMA cross)',breakout:'Breakout',meanrev:'Mean reversion',core:'Core index trend (200-bar)',trendhold:'Trend hold',trendvote:'Trend vote (14 signals)',fut_trend:'Futures trend (long/short)',long_call:'Long call',long_put:'Long put',bull_call_spread:'Bull call spread',bear_put_spread:'Bear put spread',iron_condor:'Iron condor'};
var SEGNAME={EQ:'Equities',IDX:'Index levels',FUT:'Futures',OPT:'Options',CRYPTO:'Crypto',COMM:'Commodities',FX:'Currencies',WORLD:'Global indices'};
var segRep=null,segAt=0;
function loadSeg(){if(!SERVER)return;fetch('/api/segments',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){segRep=j;segAt=Date.now()}).catch(function(){})}

var ui={tq:{q:'',strat:'all',out:'all',seg:'all',kind:'all',side:'all',from:'',to:'',sort:'time',dir:'desc',page:0,per:50},pq:'',pall:false,mq:'',lq:'',sq:{q:'',slot:'all',type:'all',min:0,page:0},st:{q:'',status:'all'},sys:'agents',seg:'all',mode:'sim',slot:'india',tab:'overview',sym:null,filter:'all',eqTable:false,speed:5,paused:false,hover:false,nextAdaptive:true,armReset:false};
var bot=null,snap=null,seed=0,chartData={},IND=window.__IND__,H0=260,acc=0;

/* ---------- data source ---------- */
var bots={},acc={sim:0,india:0},lastT=Date.now();
function mkBot(mode,adaptive){
  var sd=(Math.random()*4294967296)>>>0,b;
  if(mode==='india'&&IND){
    var hist={};IND.syms.forEach(function(id){hist[id]=IND.C[id].slice(0,H0).map(function(c){return {o:c,h:c,l:c,c:c}})});
    var cfg=Object.assign({},PaperBot.PRESETS.indices,{adaptive:adaptive,symbols:IND.syms.map(function(id){return {id:id,price:1,vol:0.01}})});
    b=PaperBot.createBot({seed:sd,cfg:cfg,history:hist});
    b.state.replayBar=H0;
    b.state.feed={mode:'replay',name:'NSE indices daily',note:'REAL NSE index closes, replayed ('+IND.dates[0]+' → '+IND.dates[IND.dates.length-1]+')'};
  }else{
    b=PaperBot.createBot({seed:sd,cfg:{adaptive:adaptive}});
    b.state.feed={mode:'sim',name:'sim',note:'SIMULATED prices (in-browser, seed '+sd+')'};
  }
  return b;
}
function stepBar(b){
  var k=b.state.replayBar;
  if(k>=IND.dates.length){b.state.ended=true;return false}
  var cm={};IND.syms.forEach(function(id){var c=IND.C[id][k];cm[id]={o:c,h:c,l:c,c:c}});
  b.stepCandle(cm);b.state.replayBar=k+1;return true;
}
function saveLocal(){try{['sim','india'].forEach(function(m){if(bots[m])localStorage.setItem('paperbot4:'+m,JSON.stringify(bots[m].state))});localStorage.setItem('paperbot4:ui',JSON.stringify({speed:ui.speed,mode:ui.mode,adaptive:ui.nextAdaptive}))}catch(e){}}
function loadLocal(){try{var u=JSON.parse(localStorage.getItem('paperbot4:ui')||'null');if(u){ui.speed=u.speed||5;ui.nextAdaptive=u.adaptive!==false;ui.mode=(u.mode==='india'&&IND)?'india':'sim'}
  ['sim','india'].forEach(function(m){var s=JSON.parse(localStorage.getItem('paperbot4:'+m)||'null');if(s&&s.v===2&&s.symbols&&(m==='sim'||IND))bots[m]=PaperBot.restoreBot(s)})}catch(e){}}
/* Both bots advance on WALL-CLOCK time, so switching tabs/markets or a throttled background tab never pauses them:
   when the page is visible again it catches up on the elapsed time. (A closed page can't trade — that needs the server.) */
function advance(){
  var now=Date.now(),dt=Math.min((now-lastT)/1000,6*3600);lastT=now;
  if(ui.paused)return;
  if(bots.india&&IND){acc.india+=dt*ui.speed;var n=Math.floor(acc.india);acc.india-=n;n=Math.min(n,500);for(var i=0;i<n;i++){if(!stepBar(bots.india))break}}
  if(bots.sim){acc.sim+=dt*4*ui.speed;var t=Math.floor(acc.sim);acc.sim-=t;if(t>0)bots.sim.step(Math.min(t,8000))}
}
function startLocal(){
  loadLocal();
  if(!bots.sim)bots.sim=mkBot('sim',true);
  if(IND&&!bots.india)bots.india=mkBot('india',true);
  setInterval(function(){advance();bot=bots[ui.mode]||bots.sim;ui.ended=!!bot.state.ended;snap=bot.snapshot()},250);
  document.addEventListener('visibilitychange',function(){if(document.hidden)saveLocal();else advance()});
  setInterval(saveLocal,15000);window.addEventListener('pagehide',saveLocal);
}
var token=null;
function qs(path){return path+(path.indexOf('?')<0?'?':'&')+'bot='+ui.slot}
function api(path){
  if(!token){try{token=sessionStorage.getItem('pbtoken')}catch(e){}}
  if(!token){token=window.prompt('Admin token (ADMIN_TOKEN env var on your server):');if(!token)return;try{sessionStorage.setItem('pbtoken',token)}catch(e){}}
  return fetch(qs(path),{method:'POST',headers:{'x-admin-token':token}}).then(function(r){if(r.status===401){token=null;try{sessionStorage.removeItem('pbtoken')}catch(e){}alert('Wrong token')}return r.json()}).then(function(){return poll()});
}
var es=null;
function poll(){var slot=ui.slot;return fetch(qs('/api/state'),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(slot!==ui.slot)return;if(j.error){$('#status').textContent=j.error+(j.note?' · '+j.note:'');return}snap=j;ui.paused=!!(j.server&&j.server.paused)}).catch(function(){})}
function openStream(){
  try{if(es)es.close();var slot=ui.slot;es=new EventSource(qs('/api/events'));es.onmessage=function(e){try{var j=JSON.parse(e.data);if(j.error||slot!==ui.slot)return;snap=j;ui.paused=!!(snap.server&&snap.server.paused)}catch(x){}};es.onerror=function(){}}catch(e){}
}
function startServer(){
  try{ui.slot=localStorage.getItem('paperbot4:slot')||'nse'}catch(e){ui.slot='nse'}
  poll();openStream();setInterval(poll,15000);loadSeg();setInterval(loadSeg,20000);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
}

/* ---------- chart helpers ---------- */
function niceTicks(lo,hi,n){var span=hi-lo||1,step=Math.pow(10,Math.floor(Math.log10(span/n))),e=span/n/step;step*=e<1.5?1:e<3?2:e<7?5:10;var a=Math.ceil(lo/step)*step,out=[];for(var v=a;v<=hi+1e-9;v+=step)out.push(v);return out}
function ema(a,n){var k=2/(n+1),e=a[0],o=[e];for(var i=1;i<a.length;i++){e=a[i]*k+e*(1-k);o.push(e)}return o}
function benchSeries(pts){
  if(!(snap.feed&&snap.feed.mode==='replay')||!IND)return null;
  var c0=IND.C.NIFTY_50[H0-1],base=snap.startBalance;
  return pts.map(function(p){var i=p.t<=0?H0-1:H0+Math.floor((p.t-1)/4);i=Math.min(i,IND.dates.length-1);return base*IND.C.NIFTY_50[i]/c0});
}
function equityChart(id,W){
  var pts=snap.equity,H=190,L=4,R=52,T=8,B=18,base=snap.startBalance;var bench=benchSeries(pts);
  var ys=pts.map(function(p){return p.eq});
  var lo=Math.min(base,Math.min.apply(null,ys)),hi=Math.max(base,Math.max.apply(null,ys));if(bench){lo=Math.min(lo,Math.min.apply(null,bench));hi=Math.max(hi,Math.max.apply(null,bench))}
  var pad=Math.max((hi-lo)*0.15,0.05);lo-=pad;hi+=pad;
  var x0=pts[0].t,x1=pts[pts.length-1].t||1;
  var X=function(t){return L+(t-x0)/Math.max(1,x1-x0)*(W-L-R)},Y=function(v){return T+(1-(v-lo)/(hi-lo))*(H-T-B)};
  var g='';niceTicks(lo,hi,4).forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--grid)"/><text x="'+(W-R+5)+'" y="'+(Y(v)+3.5)+'" fill="var(--mut)" font-size="10.5">'+CUR+v.toFixed(0)+'</text>'});
  var d='',db='';if(bench)bench.forEach(function(v,i){db+=(i?'L':'M')+X(pts[i].t).toFixed(1)+' '+Y(v).toFixed(1)});pts.forEach(function(p,i){d+=(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.eq).toFixed(1)});
  var last=pts[pts.length-1];
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Equity curve">'+g+
   '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(base)+'" y2="'+Y(base)+'" stroke="var(--mut)" stroke-dasharray="4 3"/>'+
   '<text x="'+(L+2)+'" y="'+(Y(base)-4)+'" fill="var(--mut)" font-size="10">start '+CUR+base.toFixed(0)+'</text>'+(bench?'<path d="'+db+'" fill="none" stroke="var(--orange)" stroke-width="1.6" stroke-linejoin="round"/>':'')+
   '<path d="'+d+'" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
   '<circle cx="'+X(last.t)+'" cy="'+Y(last.eq)+'" r="4" fill="var(--blue)" stroke="var(--card)" stroke-width="2"/>'+
   '<text x="'+L+'" y="'+(H-3)+'" fill="var(--mut)" font-size="10">start</text><text x="'+(W-R)+'" y="'+(H-3)+'" text-anchor="end" fill="var(--mut)" font-size="10">now</text>'+
   '<line class="xh" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--ink2)" stroke-width="1" style="display:none"/></svg>';
  chartData[id]={W:W,pts:pts.map(function(p,i){return {x:X(p.t),y:Y(p.eq),html:'<b>'+usd(p.eq)+'</b><br><span class="ink2">PnL '+usd(p.eq-base,1)+' ('+pct((p.eq-base)/base,1,1)+')'+(bench?'<br>Buy &amp; hold '+usd(bench[i])+'':'')+'</span>'}})};
  return s;
}
function candleChart(id,sym,W){
  var s=snap.symbols[sym],H=250,L=4,R=52,T=8,B=16;
  var cs=s.candles.slice();if(s.cur&&s.cur.n>0)cs.push({o:s.cur.o,h:s.cur.h,l:s.cur.l,c:s.cur.c,forming:true});
  var N=Math.min(cs.length,70),vis=cs.slice(-N);
  var closes=cs.map(function(c){return c.c});
  var ef=ema(closes,snap.params.emaFast).slice(-N),es=ema(closes,snap.params.emaSlow).slice(-N);
  var absStart=snap.candleIdx-s.candles.length+(cs.length-N);
  var pos=snap.positions.filter(function(p){return p.symbol===sym})[0];
  var lo=Math.min.apply(null,vis.map(function(c){return c.l})),hi=Math.max.apply(null,vis.map(function(c){return c.h}));
  if(pos){lo=Math.min(lo,pos.stop);hi=Math.max(hi,pos.tp)}
  var pad=(hi-lo)*0.05||hi*0.001;lo-=pad;hi+=pad;
  var pw=W-L-R,cw=pw/N,bw=Math.max(2,cw*0.62);
  var X=function(j){return L+cw*(j+0.5)},Y=function(v){return T+(1-(v-lo)/(hi-lo))*(H-T-B)};
  var g='';niceTicks(lo,hi,4).forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--grid)"/><text x="'+(W-R+5)+'" y="'+(Y(v)+3.5)+'" fill="var(--mut)" font-size="10.5">'+fmtP(v)+'</text>'});
  var c='',hv=[];
  vis.forEach(function(k,j){
    var up=k.c>=k.o,x=X(j),yo=Y(k.o),yc=Y(k.c),col=up?'var(--blue)':'var(--orange)';
    c+='<line x1="'+x+'" x2="'+x+'" y1="'+Y(k.h)+'" y2="'+Y(k.l)+'" stroke="'+col+'" stroke-width="1.2"/>'+
       '<rect x="'+(x-bw/2)+'" y="'+Math.min(yo,yc)+'" width="'+bw+'" height="'+Math.max(1.5,Math.abs(yo-yc))+'" rx="1" fill="'+(up?'var(--card)':col)+'" stroke="'+col+'" stroke-width="1.4"'+(k.forming?' stroke-dasharray="2 2"':'')+'/>';
    hv.push({x:x,y:Y(k.c),html:'<b>#'+(absStart+j)+(k.forming?' (forming)':'')+'</b><br>O '+fmtP(k.o)+' H '+fmtP(k.h)+'<br>L '+fmtP(k.l)+' C '+fmtP(k.c)});
  });
  var line=function(arr,col,w){var d='';arr.forEach(function(v,j){d+=(j?'L':'M')+X(j).toFixed(1)+' '+Y(v).toFixed(1)});return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linejoin="round"/>'};
  var lines=line(es,'var(--yellow)',1.6)+line(ef,'var(--violet)',1.6);
  var lv='';
  if(pos){
    [['entry',pos.entry,'var(--mut)','','entry'],['stop',pos.stop,'var(--crit)','5 3','stop'],['tp',pos.tp,'var(--good)','5 3','target']].forEach(function(a){
      lv+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(a[1])+'" y2="'+Y(a[1])+'" stroke="'+a[2]+'" stroke-width="1.2"'+(a[3]?' stroke-dasharray="'+a[3]+'"':'')+'/><text x="'+(L+2)+'" y="'+(Y(a[1])-3)+'" fill="var(--ink2)" font-size="10">'+a[4]+' '+fmtP(a[1])+'</text>';
    });
  }
  var mk='';
  var tri=function(x,y,dir){var sz=5;return '<polygon points="'+(dir>0?(x-sz)+','+(y+sz)+' '+(x+sz)+','+(y+sz)+' '+x+','+(y-sz+1):(x-sz)+','+(y-sz)+' '+(x+sz)+','+(y-sz)+' '+x+','+(y+sz-1))+'" fill="var(--ink)" stroke="var(--card)" stroke-width="1.5"/>'};
  var inRange=function(a){var j=a-absStart;return j>=0&&j<N?j:-1};
  snap.trades.filter(function(t){return t.symbol===sym}).forEach(function(t){
    var jo=inRange(t.openCandle),jc=inRange(t.closeCandle);
    if(jo>=0)mk+=tri(X(jo),Y(t.entry)+8,1);
    if(jc>=0)mk+=tri(X(jc),Y(t.exit)-8,-1);
  });
  if(pos){var jo=inRange(snap.candleIdx-pos.held);if(jo>=0)mk+=tri(X(jo),Y(pos.entry)+8,1)}
  var out='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Candles for '+sym+'">'+g+c+lines+lv+mk+'<line class="xh" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--ink2)" style="display:none"/></svg>';
  chartData[id]={W:W,pts:hv};
  return out;
}

  if(!o||o.key!==key){lwcKill(id);var host=document.createElement('div');host.style.cssText='width:100%;height:'+(ph.getAttribute('data-h')||260)+'px';ph.appendChild(host);var chart=LW.createChart(host,{width:Math.max(260,ph.clientWidth),height:+(ph.getAttribute('data-h')||260),
    layout:{background:{type:'solid',color:'transparent'},textColor:cssv('--ink2'),fontFamily:'inherit',fontSize:11,attributionLogo:true},grid:{vertLines:{color:cssv('--grid')},horzLines:{color:cssv('--grid')}},
    rightPriceScale:{borderColor:cssv('--line')},timeScale:{borderColor:cssv('--line'),timeVisible:false,secondsVisible:false,rightOffset:4},crosshair:{mode:0},handleScroll:{vertTouchDrag:false}});
    o=lwc[id]={chart:chart,host:host,key:key,t0:0};build(o)}
  else if(o.host.parentNode!==ph){ph.appendChild(o.host)}

var DAY=86400;
function candleTimes(n,base){var t0=Math.floor(Date.now()/1000/DAY)*DAY-(n-1)*DAY,a=[];for(var i=0;i<n;i++)a.push(t0+i*DAY);return a}
function drawCandlesLW(ph){
  var sym=ui.sym,s=snap.symbols[sym];if(!s)return;
  var cs=s.candles.slice();if(s.cur&&s.cur.n>0)cs.push({o:s.cur.o,h:s.cur.h,l:s.cur.l,c:s.cur.c});
  var n=cs.length,tm=candleTimes(n),absStart=snap.candleIdx-s.candles.length;
  var flat=cs.filter(function(c){return c.h===c.l}).length>cs.length*0.7;
  var th=document.documentElement.getAttribute('data-theme')||'auto',o=lwcHost('cc',ph,sym+'|'+th+'|'+(flat?'line':'candle'),function(o){
    o.cs=flat?o.chart.addSeries(LW.LineSeries,{color:cssv('--blue'),lineWidth:2,priceFormat:{type:'price',precision:2,minMove:0.01}}):o.chart.addSeries(LW.CandlestickSeries,{upColor:cssv('--card'),borderUpColor:cssv('--blue'),wickUpColor:cssv('--blue'),downColor:cssv('--orange'),borderDownColor:cssv('--orange'),wickDownColor:cssv('--orange'),priceFormat:{type:'price',precision:2,minMove:0.01}});
    o.ef=o.chart.addSeries(LW.LineSeries,{color:cssv('--violet'),lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    o.es=o.chart.addSeries(LW.LineSeries,{color:cssv('--yellow'),lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    o.mk=LW.createSeriesMarkers(o.cs,[]);o.lines=[];o.first=true;
  });
  var fmt=function(t){return '#'+(absStart+Math.round((t-tm[0])/DAY))};
  o.chart.applyOptions({localization:{timeFormatter:fmt},timeScale:{tickMarkFormatter:function(t){return fmt(t)}}});
  var closes=cs.map(function(c){return c.c});
  o.cs.setData(cs.map(function(c,i){return flat?{time:tm[i],value:c.c}:{time:tm[i],open:c.o,high:c.h,low:c.l,close:c.c}}));
  o.ef.setData(ema(closes,snap.params.emaFast).map(function(v,i){return {time:tm[i],value:v}}));
  o.es.setData(ema(closes,snap.params.emaSlow).map(function(v,i){return {time:tm[i],value:v}}));
  var idxOf=function(a){var j=a-absStart;return j>=0&&j<n?tm[j]:null};
  var mk=[],mine=function(t){return t.symbol===sym||t.und===sym};
  snap.trades.filter(mine).forEach(function(t){
    var short=t.dir==='SHORT',a=idxOf(t.openCandle),b=idxOf(t.closeCandle),tag=t.legs&&t.legs.length>1?'':'';
    if(a)mk.push({time:a,position:short?'aboveBar':'belowBar',shape:short?'arrowDown':'arrowUp',color:short?cssv('--crit'):cssv('--good'),text:short?'SELL':'BUY'});
    if(b)mk.push({time:b,position:short?'belowBar':'aboveBar',shape:short?'arrowUp':'arrowDown',color:cssv('--ink2'),text:short?'BUY':'SELL'});
  });
  snap.positions.filter(mine).forEach(function(p){var a=idxOf(snap.candleIdx-p.held);var short=p.dir<0;if(a)mk.push({time:a,position:short?'aboveBar':'belowBar',shape:short?'arrowDown':'arrowUp',color:short?cssv('--crit'):cssv('--good'),text:(short?'SELL':'BUY')+' (open)'})});
  mk.sort(function(x,y){return x.time-y.time});o.mk.setMarkers(mk);
  o.lines.forEach(function(l){try{o.cs.removePriceLine(l)}catch(e){}});o.lines=[];
  var pos=snap.positions.filter(function(p){return p.symbol===sym&&p.stop&&p.tp&&!p.legs})[0];
  if(pos)[['entry',pos.entry,cssv('--mut'),0],['stop',pos.stop,cssv('--crit'),2],['target',pos.tp,cssv('--good'),2]].forEach(function(a){o.lines.push(o.cs.createPriceLine({price:a[1],color:a[2],lineWidth:1,lineStyle:a[3],axisLabelVisible:true,title:a[0]}))});
  if(o.first){o.chart.timeScale().setVisibleLogicalRange({from:Math.max(0,n-80),to:n+3});o.first=false}
}

function hoverMove(e){
  var ch=e.target.closest&&e.target.closest('.chart');if(!ch||!chartData[ch.id])return;
  var d=chartData[ch.id],svg=ch.querySelector('svg');if(!svg)return;
  var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*(d.W/r.width);
  var best=null,bd=1e9;d.pts.forEach(function(p){var dd=Math.abs(p.x-x);if(dd<bd){bd=dd;best=p}});
  if(!best)return;ui.hover=true;
  var xh=svg.querySelector('.xh');xh.setAttribute('x1',best.x);xh.setAttribute('x2',best.x);xh.style.display='';
  var tip=ch.querySelector('.tip');tip.innerHTML=best.html;tip.style.display='block';
  var px=best.x*(r.width/d.W),tw=tip.offsetWidth;
  tip.style.left=Math.max(0,Math.min(r.width-tw,px-tw/2))+'px';tip.style.top='-4px';
}

function posCard(p){

function posListHtml(){

function hsSave(root){var out=[];if(!root)return out;var all=root.getElementsByTagName('*');for(var i=0;i<all.length;i++){var e=all[i];if(e.scrollLeft>0){var p=[],n=e;while(n&&n!==root){var k=0,s=n;while((s=s.previousElementSibling))k++;p.unshift(k);n=n.parentElement}if(n===root)out.push([p,e.scrollLeft])}}return out}
function hsRestore(root,saved){saved.forEach(function(x){var n=root;for(var i=0;i<x[0].length&&n;i++)n=n.children[x[0][i]];if(n)n.scrollLeft=x[1]})}
function setHTML(el,h){var x=el.scrollLeft,s=hsSave(el);el.innerHTML=h;if(s.length)hsRestore(el,s);if(x)el.scrollLeft=x}

function hashTab(){var p=location.hash.slice(1).split('/');if(p[0]==='bot'&&p[1]&&/^[A-Za-z0-9]{1,4}$/.test(p[1])){LAB.bot=p[1];try{localStorage.setItem('paperbot4:labbot',p[1])}catch(e){}}if(p[0]==='acct'&&p[1]&&/^[a-z0-9_]{1,20}$/.test(p[1]))LAB.acct=p[1];return p[0]}

function lpct(x,d){return x==null?'–':(x*100).toFixed(d==null?1:d)+'%'}
function lsgn(x,d){return x==null?'–':(x>0?'+':'')+x.toFixed(d==null?2:d)}
function cls2(x){return x==null?'':x>0?'up':x<0?'dn':''}
function ago(ms){if(!ms)return 'never';var s=Math.round((Date.now()-ms)/1000);return s<90?s+'s ago':s<5400?Math.round(s/60)+'m ago':Math.round(s/3600)+'h ago'}

function plPct(x){return x==null?'–':(x>0?'▲ +':x<0?'▼ −':'')+Math.abs(x*100).toFixed(2)+'%'}
function plCls(x){return x>0?'pos2':x<0?'neg2':''}
function money(cur,x){return x==null?'–':cur+num(x,x<100?2:0)}
function bookSum(mk){var L=LAB.d;if(!L)return null;var s={eq:0,st:0,open:0,tr:0};L.bots.forEach(function(b){var m=b.books&&b.books[mk];if(m){s.eq+=m.equity;s.st+=m.start}s.open+=b.open||0;s.tr+=(b.byBook&&b.byBook[mk]?b.byBook[mk].trades:0)});s.cur=L.bots[0]&&L.bots[0].books[mk]?L.bots[0].books[mk].cur:'';s.pct=s.st?s.eq/s.st-1:0;return s}

  h+='<div class="aclist" style="margin-top:6px">'+(rows.join('')||'<div class="sub" style="padding:14px">'+(k==='open'?'No open positions'+(mk==='ALL'?'':' in this market')+'.':'No closed trades yet'+(Object.keys(PRO.acct).length?'':' — loading…'))+'</div>')+'</div>';
  h+='<div class="hint" style="margin:10px 2px">'+(k==='closed'?'Latest trades of every account, newest first. Tap a trade to open its account. For search, filters and CSV per paper book, use Order history.':'Tap a position to open its account.')+'</div>';
  if(el.__h===h&&el.firstElementChild)return;el.__h=h;setHTML(el,h);
}
function actTab(){
  if(!$('#actroot')){$('#view').innerHTML='<div id="actroot"></div>';actPaint(true)}
  if(Date.now()-LAB.at>8000)labFetch();posFetch();
  if(!PRO.feedsBusy&&Date.now()-(PRO.feedsAt||0)>15000){PRO.feedsBusy=true;jf('/api/feeds').then(function(j){PRO.feeds=j;PRO.feedsAt=Date.now();PRO.feedsBusy=false}).catch(function(){PRO.feedsBusy=false})}
  if(APP.actk==='closed'){var bs=bookSlots();if(!bs.length&&!PRO.fundsBusy){PRO.fundsBusy=true;jf('/api/funds').then(function(j){PRO.funds=j;PRO.fundsAt=Date.now();PRO.fundsBusy=false;actTab()}).catch(function(){PRO.fundsBusy=false})}
    bs.forEach(function(b){var c=PRO.acct[b.slot];if(!c||!c.at||Date.now()-c.at>30000)acctLoad(b.slot,false)})}
  actPaint();
}
setInterval(function(){if(ui.tab==='activity')actTab()},6000);
document.addEventListener('click',function(e){var t=e.target;if(!t.closest||ui.tab!=='activity')return;var x;
  if((x=t.closest('[data-actk]'))){APP.actk=x.getAttribute('data-actk');try{localStorage.setItem('paperbot4:actk',APP.actk)}catch(er){}actTab();actPaint(true);return}

});

/* ================= Home: what you own, what needs attention, what is happening ================= */
function attention(){
  var a=[],L=LAB.d,F=PRO.funds;
  if(F&&F.books)F.books.forEach(function(b){if(b.practice)return;if(!b.ready)a.push(['warn',slotShort(b.label)+' is not running','acct',b.slot]);else if(b.halted)a.push(['crit',slotShort(b.label)+' halted by its drawdown limit','acct',b.slot])});
  if(L&&L.llm){if(!L.llm.configured)a.push(['warn','LLM bots have no API key — only rule bots trade','lab']);else if(L.llm.paused)a.push(['warn','LLM bots are paused','lab'])}
  var U=PRO.feeds&&PRO.feeds.upstox;if(U&&U.configured&&U.tokenRejected)a.push(['crit','India broker feed token was rejected','system']);
  var Y=PRO.feeds&&PRO.feeds.yahoo;if(Y&&Y.cooling>0)a.push(['warn','Yahoo data is rate-limited for '+Y.cooling+'s','system']);
  return a;
}
homePaint=function(){
  var el=$('#homeroot');if(!el)return;if(scrolling()){DIRTY.home=1;return}
  if(!PRO.fundsBusy&&(!PRO.funds||Date.now()-(PRO.fundsAt||0)>10000)&&!liveFresh()){PRO.fundsBusy=true;jf('/api/funds').then(function(j){PRO.funds=j;PRO.fundsAt=Date.now();PRO.fundsBusy=false;if(ui.tab==='home')homePaint()}).catch(function(){PRO.fundsBusy=false})}
  posFetch();wlFetch();
  var all=accounts(),T={},h='',c0=nseClock();all.forEach(function(a){if(a.eq==null)return;var t=T[a.cur]||(T[a.cur]={e:0,s:0,n:0});t.e+=a.eq;t.s+=a.start;t.n++});
  h+='<div class="actot">'+(Object.keys(T).length?Object.keys(T).map(function(c){var t=T[c],pl=t.e-t.s;return '<button class="x" data-tab="bots" data-acmk-go="'+(c==='₹'?'IN':'USD')+'" style="text-align:left;font:inherit;color:inherit"><div class="k">All '+(c==='₹'?'rupee':'dollar')+' accounts · '+t.n+'</div><div class="v">'+money(c,t.e)+'</div><div class="p '+plCls(pl)+'">'+(pl>=0?'+':'−')+c+num(Math.abs(pl),Math.abs(pl)<100?2:0)+' · '+plPct(t.s?pl/t.s:0)+'</div></button>'}).join(''):'<div class="skel" style="height:90px"></div><div class="skel" style="height:90px"></div>')+'</div>';
  h+='<div class="chips" style="margin:0 0 12px"><span class="cp"><span class="dot '+(c0.open?'on':'warn')+'" style="margin:0"></span>India '+(c0.open?'open':'closed')+'</span><span class="cp"><span class="dot on" style="margin:0"></span>Crypto 24×7</span><span class="cp"><span class="dot '+(liveFresh()?'on':'warn')+'" style="margin:0"></span>'+(liveFresh()?'Live updates':'Updating every few seconds')+'</span></div>';
  var at=attention();
  if(at.length)h+='<div class="acsec"><h3>Needs attention</h3><span>'+at.length+'</span></div><div class="aclist">'+at.map(function(x){return '<button class="acr" data-tab="'+x[2]+'"'+(x[3]?' data-acct="'+esc(x[3])+'"':'')+'><span class="dot '+x[0]+'" style="margin:0 4px"></span><span class="m"><b style="white-space:normal">'+esc(x[1])+'</b></span><span class="chev">›</span></button>'}).join('')+'</div>';
  var ps=allPos().sort(function(a,b){return Math.abs(b.pnl||0)-Math.abs(a.pnl||0)}).slice(0,5);
  h+='<div class="acsec"><h3>Biggest open positions</h3><button class="bpback" data-tab="activity" style="padding:0">All '+allPos().length+' ›</button></div><div class="aclist">'+(ps.length?ps.map(function(p){p.attr=p.slot?'data-tab="acct" data-acct="'+esc(p.slot)+'" data-asub="positions"':'data-tab="activity"';return actRow(p,false)}).join(''):'<div class="sub" style="padding:14px">'+(LAB.d?'No open positions right now.':'Loading…')+'</div>')+'</div>';
  var L=LAB.d,best=null,worst=null;all.forEach(function(a){if(a.pct==null)return;if(!best||a.pct>best.pct)best=a;if(!worst||a.pct<worst.pct)worst=a});
  if(best&&worst&&best!==worst)h+='<div class="acsec"><h3>Leaders</h3><button class="bpback" data-tab="bots" style="padding:0">All accounts ›</button></div><div class="aclist">'+acRow(best)+acRow(worst)+'</div>';
  var px=LAB.px;
  h+='<div class="acsec"><h3>Watchlist</h3><button class="bpback" data-tab="charts" style="padding:0">Charts ›</button></div><div class="card wl" style="padding:4px 12px">'+(px&&px.length?px.slice(0,10).map(function(p){var up=p.chg>0,dn=p.chg<0;return '<div class="it" data-wl="'+esc(p.sym)+'"><div class="nm"><b>'+esc(p.name)+'</b><small>'+esc(p.sym)+' · '+(p.open?'open':'closed')+'</small></div><div class="px"><b>'+esc(p.cur)+num(p.price,p.price<100?2:0)+'</b><span class="'+(up?'pos2':dn?'neg2':'')+'">'+(p.chg==null?'–':(up?'▲ +':dn?'▼ −':'')+Math.abs(p.chg*100).toFixed(2)+'%')+'</span></div></div>'}).join(''):'<div class="skel" style="height:90px"></div>')+'</div>';
  h+=foldWrap('health','System health · data feeds, LLM, vault, Telegram','<div class="card">'+(PRO.feeds?healthRows():'<div class="skel" style="height:120px"></div>')+'</div>');
  var V=PRO.bt&&PRO.bt.result&&PRO.bt.result.verdict;
  h+='<button class="fundlink" data-tab="bt" style="margin-top:12px">Backtest: '+(V?'no strategy has a proven edge yet — see why':'see which strategies survive real costs')+' <span>→</span></button>';
  if(el.__h===h&&el.firstElementChild)return;el.__h=h;setHTML(el,h);
};

(SERVER?'#ctrl #pp,#ctrl #ca,#ctrl #rs{display:none!important}#ctrl .msel select{font-weight:650}':'');document.head.appendChild(st)})();
