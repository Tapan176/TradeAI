<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PaperBot</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a1a19"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fcfcfb;--card:#ffffff;--ink:#1a1a19;--ink2:#55554f;--mut:#82827c;--line:#e6e6e1;--grid:#eeeeea;--chip:#f1f1ed;
--blue:#2a78d6;--orange:#eb6834;--aqua:#1baf7a;--yellow:#eda100;--mag:#e87ba4;--green:#008300;--violet:#6250d6;--red:#e34948;--good:#0ca30c;--crit:#d03b3b;--warn:#eda100}
:root[data-theme=dark]{--bg:#1a1a19;--card:#222220;--ink:#f2f2ef;--ink2:#b9b9b3;--mut:#8f8f89;--line:#363633;--grid:#2c2c29;--chip:#2c2c29}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1a19;--card:#222220;--ink:#f2f2ef;--ink2:#b9b9b3;--mut:#8f8f89;--line:#363633;--grid:#2c2c29;--chip:#2c2c29}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:10px 12px 40px}
html{overflow-y:scroll;scrollbar-gutter:stable}
.sub{min-height:16px}#banner{min-height:18px}#view{min-height:70vh}
.tabs{margin-top:0}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--ink2);font-size:12px}
.badge{white-space:nowrap;display:inline-block;font-size:10.5px;font-weight:650;letter-spacing:.4px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:baseline;background:var(--mut)}
.dot.on{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}
.ctrl{display:block;margin:4px 0 8px}.ctrl .r1{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}.ctrl .r2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.ctrl .r1::-webkit-scrollbar{display:none}.ctrl button{white-space:nowrap;min-height:32px;padding:5px 10px;font-size:13px}.ctrl .seg{flex:0 0 auto}.ctrl>button{flex:0 0 auto}#banner{font-size:11.5px;color:var(--mut)}#status{font-size:12.5px}
button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;min-height:36px}
button:active{transform:translateY(1px)}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.danger{border-color:var(--crit)}
.seg{display:inline-flex;gap:0}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:9px 0 0 9px;margin-left:0}.seg button:last-child{border-radius:0 9px 9px 0}
.tabs{display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:transparent;padding:7px 9px;font-size:13.5px;border-radius:8px;color:var(--ink2);font-weight:550}
.tabs button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media(min-width:640px){.grid.k3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.card h2{font-size:12px;margin:0 0 6px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.big{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15}
.mid{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.mut{color:var(--mut)}.ink2{color:var(--ink2)}
.up{color:var(--good);font-size:11px}.dn{color:var(--crit);font-size:11px}.fl{color:var(--mut);font-size:11px}
.num{font-variant-numeric:tabular-nums}
.chart{position:relative;width:100%;touch-action:pan-y;user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.18);white-space:nowrap;z-index:4;display:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend i.sq{width:9px;height:9px;border:1.5px solid;border-radius:2px}
.pos{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar{position:relative;height:6px;border-radius:3px;background:var(--grid);margin:8px 0 4px}
.bar b{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--ink)}
.fbar{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.fbar .full{grid-column:1/-1}
.fbar input,.fbar select{width:100%;min-height:36px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:13.5px;font-family:inherit}
.fbar label{font-size:11px;color:var(--mut);display:block;margin-bottom:2px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 2px;font-size:12.5px}
.pager button{min-height:34px;padding:4px 12px}
.sumbar{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:6px 0}
.scroll{overflow-x:auto}
.lwc{position:relative;width:100%;min-height:200px;touch-action:pan-y}
.pill.buy{background:var(--good);color:#fff}.pill.sell{background:var(--crit);color:#fff}
.legrow{font-size:12.5px;margin:3px 0;font-variant-numeric:tabular-nums}
.legrow b.buy{color:var(--good)}.legrow b.sell{color:var(--crit)}
.st{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;border:1px solid var(--line)}
.st.use{background:var(--good);color:#fff;border-color:var(--good)}.st.test{background:var(--yellow);color:#222;border-color:var(--yellow)}.st.rej{background:transparent;color:var(--crit);border-color:var(--crit)}.st.avail{color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;min-height:32px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.agent{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
.agent .nm{font-weight:650;font-size:13px}
.agent .ms{font-size:12px;color:var(--ink2);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.log{margin-top:8px}
.log div{display:flex;gap:7px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:flex-start}
.log .t{color:var(--mut);flex:0 0 52px;font-variant-numeric:tabular-nums;font-size:11.5px;padding-top:1px}
.log .a{flex:0 0 74px;font-weight:600;font-size:12px}
.log .a u{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;text-decoration:none}
.log .m{flex:1;word-break:break-word}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:650;border:1px solid var(--line);background:var(--chip)}
.pill.active{border-color:var(--good)}.pill.shadow{border-color:var(--mut)}.pill.explore{border-color:var(--yellow)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:600;color:var(--ink2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:4px 4px}
td{padding:6px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
.note{font-size:12px;color:var(--ink2);margin:8px 0}
.warnbox{border:1px solid var(--warn);border-radius:10px;padding:8px 10px;font-size:12.5px;background:var(--card);margin:8px 0}
.crit{border-color:var(--crit)}
ul.tight{margin:6px 0;padding-left:18px}ul.tight li{margin:3px 0}
.empty{color:var(--mut);padding:10px 2px;font-size:13px}
.trade{border-top:1px solid var(--line);padding:8px 0}
footer{color:var(--mut);font-size:11.5px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>PaperBot <span class="mut" style="font-weight:400">· adaptive</span></h1>
      <div class="sub" id="status">starting…</div>
    </div>
    <div style="text-align:right"><span class="badge" id="badge">PAPER MONEY</span><div style="margin-top:6px"><button id="theme" title="Theme" style="padding:3px 9px;min-height:28px">◐</button> <button id="install" title="Install as an app" style="padding:3px 9px;min-height:28px;display:none;white-space:nowrap">Install</button></div></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="note" id="banner" style="margin:6px 0 6px"></div>
  <div class="ctrl" id="ctrl"></div>
  <div id="view"></div>
  <footer>Educational simulation. Paper money only — not financial advice. Past or simulated results do not predict real trading results.<br>Charts: <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts™</a> (Apache-2.0). Copyright © TradingView, Inc.</footer>
</div>
<script>window.__SERVER__=true;</script>
<script src="vendor/lightweight-charts.js"></script><script></script>
<script>window.__IND__=null;</script>
<script>
(function(){
'use strict';
var SERVER=window.__SERVER__;
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var CUR='$';
var usd=function(x,sign){return (x<0?'−'+CUR:(sign&&x>0?'+'+CUR:CUR))+Math.abs(x).toFixed(2)};
var pct=function(x,d,sign){return (x<0?'−':(sign&&x>0?'+':''))+Math.abs(x*100).toFixed(d==null?1:d)+'%'};
var sg=function(x,d){return (x>=0?'+':'−')+Math.abs(x).toFixed(d==null?2:d)};
var fmtP=function(p){return p>=1000?p.toFixed(1):p>=100?p.toFixed(2):p>=1?p.toFixed(3):p.toFixed(5)};
var arrow=function(x){return x>0.00001?'<span class="up">▲</span>':x<-0.00001?'<span class="dn">▼</span>':'<span class="fl">■</span>'};
var hhmmss=function(ts){var d=new Date(ts);return d.toTimeString().slice(0,8)};
var AGENT_COL={Supervisor:'#2a78d6',Data:'#eb6834',Analyst:'#1baf7a',Strategy:'#eda100',Learner:'#e87ba4',Risk:'#008300',Executor:'#6250d6',Reporter:'#e34948'};
var LV={trade:'●',signal:'◆',warn:'▲',risk:'■',learn:'✦',critical:'✖',info:'·'};
var STRAT={trend:'Trend (EMA cross)',breakout:'Breakout',meanrev:'Mean reversion',core:'Core index trend (200-bar)',trendhold:'Trend hold',trendvote:'Trend vote (14 signals)',fut_trend:'Futures trend (long/short)',long_call:'Long call',long_put:'Long put',bull_call_spread:'Bull call spread',bear_put_spread:'Bear put spread',iron_condor:'Iron condor'};
var SEGNAME={EQ:'Equities',IDX:'Index levels',FUT:'Futures',OPT:'Options',CRYPTO:'Crypto',COMM:'Commodities',FX:'Currencies',WORLD:'Global indices'};
var segRep=null,segAt=0;
function loadSeg(){if(!SERVER)return;fetch('/api/segments',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){segRep=j;segAt=Date.now()}).catch(function(){})}

var ui={tq:{q:'',strat:'all',out:'all',seg:'all',kind:'all',side:'all',from:'',to:'',sort:'time',dir:'desc',page:0,per:50},pq:'',pall:false,mq:'',lq:'',sq:{q:'',slot:'all',type:'all',min:0,page:0},st:{q:'',status:'all'},sys:'agents',seg:'all',mode:'sim',slot:'india',tab:'overview',sym:null,filter:'all',eqTable:false,speed:5,paused:false,hover:false,nextAdaptive:true,armReset:false};
var bot=null,snap=null,seed=0,chartData={},IND=window.__IND__,H0=260,acc=0;

/* ---------- data source ---------- */
var bots={},acc={sim:0,india:0},lastT=Date.now();
function mkBot(mode,adaptive){
  var sd=(Math.random()*4294967296)>>>0,b;
  if(mode==='india'&&IND){
    var hist={};IND.syms.forEach(function(id){hist[id]=IND.C[id].slice(0,H0).map(function(c){return {o:c,h:c,l:c,c:c}})});
    var cfg=Object.assign({},PaperBot.PRESETS.indices,{adaptive:adaptive,symbols:IND.syms.map(function(id){return {id:id,price:1,vol:0.01}})});
    b=PaperBot.createBot({seed:sd,cfg:cfg,history:hist});
    b.state.replayBar=H0;
    b.state.feed={mode:'replay',name:'NSE indices daily',note:'REAL NSE index closes, replayed ('+IND.dates[0]+' → '+IND.dates[IND.dates.length-1]+')'};
  }else{
    b=PaperBot.createBot({seed:sd,cfg:{adaptive:adaptive}});
    b.state.feed={mode:'sim',name:'sim',note:'SIMULATED prices (in-browser, seed '+sd+')'};
  }
  return b;
}
function stepBar(b){
  var k=b.state.replayBar;
  if(k>=IND.dates.length){b.state.ended=true;return false}
  var cm={};IND.syms.forEach(function(id){var c=IND.C[id][k];cm[id]={o:c,h:c,l:c,c:c}});
  b.stepCandle(cm);b.state.replayBar=k+1;return true;
}
function saveLocal(){try{['sim','india'].forEach(function(m){if(bots[m])localStorage.setItem('paperbot4:'+m,JSON.stringify(bots[m].state))});localStorage.setItem('paperbot4:ui',JSON.stringify({speed:ui.speed,mode:ui.mode,adaptive:ui.nextAdaptive}))}catch(e){}}
function loadLocal(){try{var u=JSON.parse(localStorage.getItem('paperbot4:ui')||'null');if(u){ui.speed=u.speed||5;ui.nextAdaptive=u.adaptive!==false;ui.mode=(u.mode==='india'&&IND)?'india':'sim'}
  ['sim','india'].forEach(function(m){var s=JSON.parse(localStorage.getItem('paperbot4:'+m)||'null');if(s&&s.v===2&&s.symbols&&(m==='sim'||IND))bots[m]=PaperBot.restoreBot(s)})}catch(e){}}
/* Both bots advance on WALL-CLOCK time, so switching tabs/markets or a throttled background tab never pauses them:
   when the page is visible again it catches up on the elapsed time. (A closed page can't trade — that needs the server.) */
function advance(){
  var now=Date.now(),dt=Math.min((now-lastT)/1000,6*3600);lastT=now;
  if(ui.paused)return;
  if(bots.india&&IND){acc.india+=dt*ui.speed;var n=Math.floor(acc.india);acc.india-=n;n=Math.min(n,500);for(var i=0;i<n;i++){if(!stepBar(bots.india))break}}
  if(bots.sim){acc.sim+=dt*4*ui.speed;var t=Math.floor(acc.sim);acc.sim-=t;if(t>0)bots.sim.step(Math.min(t,8000))}
}
function startLocal(){
  loadLocal();
  if(!bots.sim)bots.sim=mkBot('sim',true);
  if(IND&&!bots.india)bots.india=mkBot('india',true);
  setInterval(function(){advance();bot=bots[ui.mode]||bots.sim;ui.ended=!!bot.state.ended;snap=bot.snapshot()},250);
  document.addEventListener('visibilitychange',function(){if(document.hidden)saveLocal();else advance()});
  setInterval(saveLocal,15000);window.addEventListener('pagehide',saveLocal);
}
var token=null;
function qs(path){return path+(path.indexOf('?')<0?'?':'&')+'bot='+ui.slot}
function api(path){
  if(!token){try{token=sessionStorage.getItem('pbtoken')}catch(e){}}
  if(!token){token=window.prompt('Admin token (ADMIN_TOKEN env var on your server):');if(!token)return;try{sessionStorage.setItem('pbtoken',token)}catch(e){}}
  return fetch(qs(path),{method:'POST',headers:{'x-admin-token':token}}).then(function(r){if(r.status===401){token=null;try{sessionStorage.removeItem('pbtoken')}catch(e){}alert('Wrong token')}return r.json()}).then(function(){return poll()});
}
var es=null;
function poll(){var slot=ui.slot;return fetch(qs('/api/state'),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(slot!==ui.slot)return;if(j.error){$('#status').textContent=j.error+(j.note?' · '+j.note:'');return}snap=j;ui.paused=!!(j.server&&j.server.paused)}).catch(function(){})}
function openStream(){
  try{if(es)es.close();var slot=ui.slot;es=new EventSource(qs('/api/events'));es.onmessage=function(e){try{var j=JSON.parse(e.data);if(j.error||slot!==ui.slot)return;snap=j;ui.paused=!!(snap.server&&snap.server.paused)}catch(x){}};es.onerror=function(){}}catch(e){}
}
function startServer(){
  try{ui.slot=localStorage.getItem('paperbot4:slot')||'nse'}catch(e){ui.slot='nse'}
  poll();openStream();setInterval(poll,15000);loadSeg();setInterval(loadSeg,20000);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
}

/* ---------- chart helpers ---------- */
function niceTicks(lo,hi,n){var span=hi-lo||1,step=Math.pow(10,Math.floor(Math.log10(span/n))),e=span/n/step;step*=e<1.5?1:e<3?2:e<7?5:10;var a=Math.ceil(lo/step)*step,out=[];for(var v=a;v<=hi+1e-9;v+=step)out.push(v);return out}
function ema(a,n){var k=2/(n+1),e=a[0],o=[e];for(var i=1;i<a.length;i++){e=a[i]*k+e*(1-k);o.push(e)}return o}
function benchSeries(pts){
  if(!(snap.feed&&snap.feed.mode==='replay')||!IND)return null;
  var c0=IND.C.NIFTY_50[H0-1],base=snap.startBalance;
  return pts.map(function(p){var i=p.t<=0?H0-1:H0+Math.floor((p.t-1)/4);i=Math.min(i,IND.dates.length-1);return base*IND.C.NIFTY_50[i]/c0});
}
function equityChart(id,W){
  var pts=snap.equity,H=190,L=4,R=52,T=8,B=18,base=snap.startBalance;var bench=benchSeries(pts);
  var ys=pts.map(function(p){return p.eq});
  var lo=Math.min(base,Math.min.apply(null,ys)),hi=Math.max(base,Math.max.apply(null,ys));if(bench){lo=Math.min(lo,Math.min.apply(null,bench));hi=Math.max(hi,Math.max.apply(null,bench))}
  var pad=Math.max((hi-lo)*0.15,0.05);lo-=pad;hi+=pad;
  var x0=pts[0].t,x1=pts[pts.length-1].t||1;
  var X=function(t){return L+(t-x0)/Math.max(1,x1-x0)*(W-L-R)},Y=function(v){return T+(1-(v-lo)/(hi-lo))*(H-T-B)};
  var g='';niceTicks(lo,hi,4).forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--grid)"/><text x="'+(W-R+5)+'" y="'+(Y(v)+3.5)+'" fill="var(--mut)" font-size="10.5">'+CUR+v.toFixed(0)+'</text>'});
  var d='',db='';if(bench)bench.forEach(function(v,i){db+=(i?'L':'M')+X(pts[i].t).toFixed(1)+' '+Y(v).toFixed(1)});pts.forEach(function(p,i){d+=(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.eq).toFixed(1)});
  var last=pts[pts.length-1];
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Equity curve">'+g+
   '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(base)+'" y2="'+Y(base)+'" stroke="var(--mut)" stroke-dasharray="4 3"/>'+
   '<text x="'+(L+2)+'" y="'+(Y(base)-4)+'" fill="var(--mut)" font-size="10">start '+CUR+base.toFixed(0)+'</text>'+(bench?'<path d="'+db+'" fill="none" stroke="var(--orange)" stroke-width="1.6" stroke-linejoin="round"/>':'')+
   '<path d="'+d+'" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
   '<circle cx="'+X(last.t)+'" cy="'+Y(last.eq)+'" r="4" fill="var(--blue)" stroke="var(--card)" stroke-width="2"/>'+
   '<text x="'+L+'" y="'+(H-3)+'" fill="var(--mut)" font-size="10">start</text><text x="'+(W-R)+'" y="'+(H-3)+'" text-anchor="end" fill="var(--mut)" font-size="10">now</text>'+
   '<line class="xh" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--ink2)" stroke-width="1" style="display:none"/></svg>';
  chartData[id]={W:W,pts:pts.map(function(p,i){return {x:X(p.t),y:Y(p.eq),html:'<b>'+usd(p.eq)+'</b><br><span class="ink2">PnL '+usd(p.eq-base,1)+' ('+pct((p.eq-base)/base,1,1)+')'+(bench?'<br>Buy &amp; hold '+usd(bench[i])+'':'')+'</span>'}})};
  return s;
}
function candleChart(id,sym,W){
  var s=snap.symbols[sym],H=250,L=4,R=52,T=8,B=16;
  var cs=s.candles.slice();if(s.cur&&s.cur.n>0)cs.push({o:s.cur.o,h:s.cur.h,l:s.cur.l,c:s.cur.c,forming:true});
  var N=Math.min(cs.length,70),vis=cs.slice(-N);
  var closes=cs.map(function(c){return c.c});
  var ef=ema(closes,snap.params.emaFast).slice(-N),es=ema(closes,snap.params.emaSlow).slice(-N);
  var absStart=snap.candleIdx-s.candles.length+(cs.length-N);
  var pos=snap.positions.filter(function(p){return p.symbol===sym})[0];
  var lo=Math.min.apply(null,vis.map(function(c){return c.l})),hi=Math.max.apply(null,vis.map(function(c){return c.h}));
  if(pos){lo=Math.min(lo,pos.stop);hi=Math.max(hi,pos.tp)}
  var pad=(hi-lo)*0.05||hi*0.001;lo-=pad;hi+=pad;
  var pw=W-L-R,cw=pw/N,bw=Math.max(2,cw*0.62);
  var X=function(j){return L+cw*(j+0.5)},Y=function(v){return T+(1-(v-lo)/(hi-lo))*(H-T-B)};
  var g='';niceTicks(lo,hi,4).forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--grid)"/><text x="'+(W-R+5)+'" y="'+(Y(v)+3.5)+'" fill="var(--mut)" font-size="10.5">'+fmtP(v)+'</text>'});
  var c='',hv=[];
  vis.forEach(function(k,j){
    var up=k.c>=k.o,x=X(j),yo=Y(k.o),yc=Y(k.c),col=up?'var(--blue)':'var(--orange)';
    c+='<line x1="'+x+'" x2="'+x+'" y1="'+Y(k.h)+'" y2="'+Y(k.l)+'" stroke="'+col+'" stroke-width="1.2"/>'+
       '<rect x="'+(x-bw/2)+'" y="'+Math.min(yo,yc)+'" width="'+bw+'" height="'+Math.max(1.5,Math.abs(yo-yc))+'" rx="1" fill="'+(up?'var(--card)':col)+'" stroke="'+col+'" stroke-width="1.4"'+(k.forming?' stroke-dasharray="2 2"':'')+'/>';
    hv.push({x:x,y:Y(k.c),html:'<b>#'+(absStart+j)+(k.forming?' (forming)':'')+'</b><br>O '+fmtP(k.o)+' H '+fmtP(k.h)+'<br>L '+fmtP(k.l)+' C '+fmtP(k.c)});
  });
  var line=function(arr,col,w){var d='';arr.forEach(function(v,j){d+=(j?'L':'M')+X(j).toFixed(1)+' '+Y(v).toFixed(1)});return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linejoin="round"/>'};
  var lines=line(es,'var(--yellow)',1.6)+line(ef,'var(--violet)',1.6);
  var lv='';
  if(pos){
    [['entry',pos.entry,'var(--mut)','','entry'],['stop',pos.stop,'var(--crit)','5 3','stop'],['tp',pos.tp,'var(--good)','5 3','target']].forEach(function(a){
      lv+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(a[1])+'" y2="'+Y(a[1])+'" stroke="'+a[2]+'" stroke-width="1.2"'+(a[3]?' stroke-dasharray="'+a[3]+'"':'')+'/><text x="'+(L+2)+'" y="'+(Y(a[1])-3)+'" fill="var(--ink2)" font-size="10">'+a[4]+' '+fmtP(a[1])+'</text>';
    });
  }
  var mk='';
  var tri=function(x,y,dir){var sz=5;return '<polygon points="'+(dir>0?(x-sz)+','+(y+sz)+' '+(x+sz)+','+(y+sz)+' '+x+','+(y-sz+1):(x-sz)+','+(y-sz)+' '+(x+sz)+','+(y-sz)+' '+x+','+(y+sz-1))+'" fill="var(--ink)" stroke="var(--card)" stroke-width="1.5"/>'};
  var inRange=function(a){var j=a-absStart;return j>=0&&j<N?j:-1};
  snap.trades.filter(function(t){return t.symbol===sym}).forEach(function(t){
    var jo=inRange(t.openCandle),jc=inRange(t.closeCandle);
    if(jo>=0)mk+=tri(X(jo),Y(t.entry)+8,1);
    if(jc>=0)mk+=tri(X(jc),Y(t.exit)-8,-1);
  });
  if(pos){var jo=inRange(snap.candleIdx-pos.held);if(jo>=0)mk+=tri(X(jo),Y(pos.entry)+8,1)}
  var out='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Candles for '+sym+'">'+g+c+lines+lv+mk+'<line class="xh" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--ink2)" style="display:none"/></svg>';
  chartData[id]={W:W,pts:hv};
  return out;
}

  if(!o||o.key!==key){lwcKill(id);var host=document.createElement('div');host.style.cssText='width:100%;height:'+(ph.getAttribute('data-h')||260)+'px';ph.appendChild(host);var chart=LW.createChart(host,{width:Math.max(260,ph.clientWidth),height:+(ph.getAttribute('data-h')||260),
    layout:{background:{type:'solid',color:'transparent'},textColor:cssv('--ink2'),fontFamily:'inherit',fontSize:11,attributionLogo:true},grid:{vertLines:{color:cssv('--grid')},horzLines:{color:cssv('--grid')}},
    rightPriceScale:{borderColor:cssv('--line')},timeScale:{borderColor:cssv('--line'),timeVisible:false,secondsVisible:false,rightOffset:4},crosshair:{mode:0},handleScroll:{vertTouchDrag:false}});
    o=lwc[id]={chart:chart,host:host,key:key,t0:0};build(o)}
  else if(o.host.parentNode!==ph){ph.appendChild(o.host)}

var DAY=86400;
function candleTimes(n,base){var t0=Math.floor(Date.now()/1000/DAY)*DAY-(n-1)*DAY,a=[];for(var i=0;i<n;i++)a.push(t0+i*DAY);return a}
function drawCandlesLW(ph){
  var sym=ui.sym,s=snap.symbols[sym];if(!s)return;
  var cs=s.candles.slice();if(s.cur&&s.cur.n>0)cs.push({o:s.cur.o,h:s.cur.h,l:s.cur.l,c:s.cur.c});
  var n=cs.length,tm=candleTimes(n),absStart=snap.candleIdx-s.candles.length;
  var flat=cs.filter(function(c){return c.h===c.l}).length>cs.length*0.7;
  var th=document.documentElement.getAttribute('data-theme')||'auto',o=lwcHost('cc',ph,sym+'|'+th+'|'+(flat?'line':'candle'),function(o){
    o.cs=flat?o.chart.addSeries(LW.LineSeries,{color:cssv('--blue'),lineWidth:2,priceFormat:{type:'price',precision:2,minMove:0.01}}):o.chart.addSeries(LW.CandlestickSeries,{upColor:cssv('--card'),borderUpColor:cssv('--blue'),wickUpColor:cssv('--blue'),downColor:cssv('--orange'),borderDownColor:cssv('--orange'),wickDownColor:cssv('--orange'),priceFormat:{type:'price',precision:2,minMove:0.01}});
    o.ef=o.chart.addSeries(LW.LineSeries,{color:cssv('--violet'),lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    o.es=o.chart.addSeries(LW.LineSeries,{color:cssv('--yellow'),lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    o.mk=LW.createSeriesMarkers(o.cs,[]);o.lines=[];o.first=true;
  });
  var fmt=function(t){return '#'+(absStart+Math.round((t-tm[0])/DAY))};
  o.chart.applyOptions({localization:{timeFormatter:fmt},timeScale:{tickMarkFormatter:function(t){return fmt(t)}}});
  var closes=cs.map(function(c){return c.c});
  o.cs.setData(cs.map(function(c,i){return flat?{time:tm[i],value:c.c}:{time:tm[i],open:c.o,high:c.h,low:c.l,close:c.c}}));
  o.ef.setData(ema(closes,snap.params.emaFast).map(function(v,i){return {time:tm[i],value:v}}));
  o.es.setData(ema(closes,snap.params.emaSlow).map(function(v,i){return {time:tm[i],value:v}}));
  var idxOf=function(a){var j=a-absStart;return j>=0&&j<n?tm[j]:null};
  var mk=[],mine=function(t){return t.symbol===sym||t.und===sym};
  snap.trades.filter(mine).forEach(function(t){
    var short=t.dir==='SHORT',a=idxOf(t.openCandle),b=idxOf(t.closeCandle),tag=t.legs&&t.legs.length>1?'':'';
    if(a)mk.push({time:a,position:short?'aboveBar':'belowBar',shape:short?'arrowDown':'arrowUp',color:short?cssv('--crit'):cssv('--good'),text:short?'SELL':'BUY'});
    if(b)mk.push({time:b,position:short?'belowBar':'aboveBar',shape:short?'arrowUp':'arrowDown',color:cssv('--ink2'),text:short?'BUY':'SELL'});
  });
  snap.positions.filter(mine).forEach(function(p){var a=idxOf(snap.candleIdx-p.held);var short=p.dir<0;if(a)mk.push({time:a,position:short?'aboveBar':'belowBar',shape:short?'arrowDown':'arrowUp',color:short?cssv('--crit'):cssv('--good'),text:(short?'SELL':'BUY')+' (open)'})});
  mk.sort(function(x,y){return x.time-y.time});o.mk.setMarkers(mk);
  o.lines.forEach(function(l){try{o.cs.removePriceLine(l)}catch(e){}});o.lines=[];
  var pos=snap.positions.filter(function(p){return p.symbol===sym&&p.stop&&p.tp&&!p.legs})[0];
  if(pos)[['entry',pos.entry,cssv('--mut'),0],['stop',pos.stop,cssv('--crit'),2],['target',pos.tp,cssv('--good'),2]].forEach(function(a){o.lines.push(o.cs.createPriceLine({price:a[1],color:a[2],lineWidth:1,lineStyle:a[3],axisLabelVisible:true,title:a[0]}))});
  if(o.first){o.chart.timeScale().setVisibleLogicalRange({from:Math.max(0,n-80),to:n+3});o.first=false}
}

function hoverMove(e){
  var ch=e.target.closest&&e.target.closest('.chart');if(!ch||!chartData[ch.id])return;
  var d=chartData[ch.id],svg=ch.querySelector('svg');if(!svg)return;
  var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*(d.W/r.width);
  var best=null,bd=1e9;d.pts.forEach(function(p){var dd=Math.abs(p.x-x);if(dd<bd){bd=dd;best=p}});
  if(!best)return;ui.hover=true;
  var xh=svg.querySelector('.xh');xh.setAttribute('x1',best.x);xh.setAttribute('x2',best.x);xh.style.display='';
  var tip=ch.querySelector('.tip');tip.innerHTML=best.html;tip.style.display='block';
  var px=best.x*(r.width/d.W),tw=tip.offsetWidth;
  tip.style.left=Math.max(0,Math.min(r.width-tw,px-tw/2))+'px';tip.style.top='-4px';
}

function posCard(p){

function posListHtml(){

  h+=chip(L.configured,'LLM '+(L.configured?esc(L.tier||'on')+' · '+L.calls+'/'+(L.cap||'?')+' calls today'+(L.backingOff?' · backing off':''):'no key'));
  h+=chip(V.configured,'Vault '+(V.configured?(V.lastCommit?'commit '+esc(V.lastCommit)+' · '+ago(V.lastAt):'waiting for first sync'):'off'));
  h+=chip(T.channel?(T.err?false:true):null,'Telegram '+(T.channel?'@'+esc(T.channel)+(T.err?' · '+esc(T.err):' · polled '+ago(T.lastPoll)):'no channel'));
  h+=chip(null,'queue '+d.queue+' · up '+d.uptimeMin+'m');
  var warn='';
  if(!L.configured)warn+='<div class="warnbox"><b>LLM key missing.</b> Set <code>LLM_API_KEY</code> (OpenRouter key) in Render → Environment. Until then only the rule bot (A) trades; B, C, C0 sit idle. Nothing else is needed.</div>';
  if(L.lastError&&L.configured)warn+='<div class="warnbox">Last LLM error: '+esc(L.lastError.msg)+' · '+ago(L.lastError.at)+'</div>';
  if(V.lastError)warn+='<div class="warnbox">Vault error: '+esc(V.lastError)+'</div>';
  if(!V.configured)warn+='<div class="sub" style="margin:4px 0">Vault off: set <code>VAULT_REPO</code> + <code>VAULT_TOKEN</code> to keep permanent notes and survive restarts.</div>';
  return '<div class="card"><h2>Status</h2>'+h+warn+'</div>';
}
function labCompare(d){
  var mk=LAB.mk,seg='<span class="seg">'+['IN','CRYPTO'].map(function(k){return '<button data-labmk="'+k+'" class="'+(mk===k?'on':'')+'">'+MKT[k]+'</button>'}).join('')+'</span>';
  var rows=d.bots.map(function(b){var m=b.byBook[mk],v=b.vsRule,tag=(m.trades<30?'<span class="mut"> · tiny sample</span>':'');
    var vs=b.id==='A'?'<span class="mut">benchmark</span>':(v&&v.mean!=null?'<span class="'+cls2(v.mean)+'">'+lsgn(v.mean)+'R/day</span>'+(v.ci?' <span class="mut">['+lsgn(v.ci[0])+', '+lsgn(v.ci[1])+']</span>':''):'<span class="mut">needs 5+ days</span>');
    return '<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+BOTCOL[b.id]+';margin-right:6px;vertical-align:middle"></i><b>'+esc(b.id)+'</b><div class="sub" style="font-size:11px;line-height:1.2">'+esc(b.name)+'</div></td><td class="r num">'+m.trades+tag+'</td><td class="r num">'+(m.hit==null?'–':lpct(m.hit,0)+' <span class="mut">('+lpct(m.hitCI[0],0)+'–'+lpct(m.hitCI[1],0)+')</span>')+'</td><td class="r num '+cls2(m.expR)+'">'+(m.expR==null?'–':lsgn(m.expR))+'</td><td class="r num '+cls2(m.pnlPct)+'">'+lsgn(m.pnlPct*100)+'%</td><td class="r num">'+m.open+'</td><td class="r num">'+(b.stats.vetoed||0)+'/'+(b.stats.unreviewed||0)+'</td><td class="r">'+vs+'</td></tr>'}).join('');
  return '<div class="card"><div class="row"><h2>Bots, judged per market</h2>'+seg+'</div><div class="scroll"><table><tr><th>Bot</th><th class="r">Trades</th><th class="r">Hit rate (95% CI)</th><th class="r">Expect. R</th><th class="r">P&amp;L</th><th class="r">Open</th><th class="r" title="vetoed / could not be reviewed">Veto/skip</th><th class="r">vs rule bot</th></tr>'+rows+'</table></div>'+
    '<div class="sub" style="margin-top:6px">Same data, fees (4–5 bps) and 0.5% risk per trade for every bot. R = profit in units of the amount risked. Do not trust any ranking before ~100 trades per bot per market; an LLM bot can only be judged on forward results, never on a back-test.</div></div>';
}
function labPositions(d){
  var P=d.positions.filter(function(p){return (p.cur==='₹')===(LAB.mk==='IN')});
  var h=P.length?P.map(function(p){return '<div class="pos"><div class="row"><b><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+BOTCOL[p.bot]+';margin-right:5px"></i>'+esc(p.bot)+' · '+esc(p.side)+' '+esc(p.name)+'</b><span class="num '+cls2(p.r)+'">'+lsgn(p.r)+'R</span></div><div class="sub num">in '+p.cur+p.entry.toFixed(2)+' · now '+p.cur+p.last.toFixed(2)+' · stop '+p.stop.toFixed(2)+(p.target?' · target '+p.target.toFixed(2):'')+'</div><div class="sub">'+esc((p.why||'').slice(0,160))+'</div></div>'}).join(''):'<div class="sub">No open positions in this market.</div>';
  var T=d.trades.filter(function(t){return t.book===LAB.mk}).slice(0,25);
  var th=T.length?'<div class="scroll"><table><tr><th>Closed</th><th>Bot</th><th>Trade</th><th class="r">R</th><th class="r">Net</th><th>Exit</th></tr>'+T.map(function(t){return '<tr><td>'+istStr(t.closeT)+'</td><td>'+esc(t.bot)+'</td><td>'+esc(t.side)+' '+esc(t.name)+'</td><td class="r num '+cls2(t.r)+'">'+lsgn(t.r)+'</td><td class="r num '+cls2(t.pnl)+'">'+money(t.cur,t.pnl)+'</td><td>'+esc(t.reason)+'</td></tr>'}).join('')+'</table></div>':'<div class="sub">No closed trades yet in this market.</div>';
  return '<div class="card"><h2>Open positions · '+MKT[LAB.mk]+'</h2>'+h+'</div><div class="card" style="margin-top:8px"><h2>Recent closed trades · '+MKT[LAB.mk]+' (times IST)</h2>'+th+'</div>';
}
function labScan(d){
  var rows=d.scan.map(function(s){var c=s.cur==='₹'?'₹':'$';return '<tr><td>'+esc(s.name)+'</td><td class="r num">'+(s.price!=null?c+s.price.toFixed(2):'–')+'</td><td>'+(s.open?'open':'<span class="mut">closed</span>')+(s.stale?' · <span class="dn">stale</span>':'')+'</td><td>'+esc(s.regime||'–')+'</td><td class="r num">'+(s.rsi==null?'–':s.rsi)+'</td><td class="r num">'+(s.adx==null?'–':s.adx)+'</td><td>'+(s.sig>0?'<span class="up">long</span>':s.sig<0?'<span class="dn">short</span>':'<span class="mut">none</span>')+'</td></tr>'}).join('');
  return '<div class="card"><h2>Live scan (15-minute bars)</h2><div class="scroll"><table><tr><th>Instrument</th><th class="r">Price</th><th>Market</th><th>Regime</th><th class="r">RSI</th><th class="r">ADX</th><th>Rule signal</th></tr>'+rows+'</table></div></div>';
}
function labLessons(d){
  var Ls=d.lessons.filter(function(l){return l.cond.indexOf('book='+LAB.mk)>=0});
  var h=Ls.length?Ls.map(function(l){return '<div class="pos"><div class="row"><b>'+esc(l.id)+' · '+esc(l.claim)+'</b><span class="badge">'+esc(l.status)+'</span></div><div class="sub">if '+esc(l.cond)+' · evidence '+l.support+' agree / '+l.contra+' disagree'+(l.meanR!=null?' · avg '+lsgn(l.meanR)+'R':'')+(l.retiredWhy?' · retired: '+esc(l.retiredWhy):'')+'</div></div>'}).join(''):'<div class="sub">No lessons yet. The hybrid bot reviews each closed trade; a lesson is only a candidate until '+d.cfg.lessonMinN+'+ later trades confirm it, and only active lessons can shrink position size.</div>';
  return '<div class="card"><h2>Lessons learned · '+MKT[LAB.mk]+'</h2>'+h+'</div>';
}
function labDecisions(d){
  var h=d.decisions.slice(0,40).map(function(x){return '<tr><td class="num">'+new Date(x.t+19800000).toISOString().slice(11,16)+'</td><td>'+esc(x.bot)+'</td><td>'+esc(x.sym)+'</td><td><span class="badge">'+esc(x.kind)+'</span></td><td>'+esc(x.text)+'</td></tr>'}).join('');
  return '<div class="card"><h2>Decision log (IST)</h2><div class="scroll"><table><tr><th>Time</th><th>Bot</th><th>Symbol</th><th>Kind</th><th>Detail</th></tr>'+h+'</table></div></div>';
}
function labTg(d){
  var T=d.tg,S=T.score,h='<div class="card"><h2>Telegram channel follower (Bot D)</h2>';
  if(!T.channel)h+='<div class="warnbox">No channel set. Add env <code>TG_CHANNEL</code> (the public channel username, as in t.me/<b>name</b>), or paste calls below.</div>';
  h+='<div class="sumbar"><span>Calls seen <b>'+S.called+'</b></span><span>Triggered <b>'+S.triggered+'</b></span><span>Never triggered <b>'+S.notTriggered+'</b></span><span>Hit rate <b>'+(S.hit==null?'–':lpct(S.hit,0)+' ('+lpct(S.hitCI[0],0)+'–'+lpct(S.hitCI[1],0)+')')+'</b></span><span>Expectancy <b>'+(S.expR==null?'–':lsgn(S.expR)+'R')+'</b></span><span>Unscored <b>'+S.unscored+'</b></span></div>';
  h+='<div class="sub">Scored conservatively: entry only after we first saw the message, stop assumed first if one bar touches both levels, targets split equally, no history backfill. Index-option calls use modelled option prices (NSE option chain is not reachable), and are skipped when the modelled premium disagrees with the quoted one.</div>';
  h+='<div style="margin-top:8px"><textarea id="tgtxt" rows="3" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:8px;font:inherit" placeholder="Paste a channel call here, e.g. BUY RELIANCE CMP 2895 SL 2870 T1 2930 T2 2960"></textarea><button id="tgsend" style="margin-top:6px">Add call</button> <span class="sub" id="tgmsg">'+esc(LAB.tgmsg)+'</span></div>';
  var rows=T.signals.slice(0,30).map(function(s){var o=s.outcome||s.state;return '<tr><td>'+new Date(s.seenAt+19800000).toISOString().slice(5,16).replace('T',' ')+'</td><td>'+esc((s.und||'')+(s.strike?' '+s.strike+(s.opt||''):'')+' '+(s.side||''))+'</td><td>'+esc(s.text.slice(0,80))+'</td><td>'+esc(o)+(s.note&&s.state!=='closed'?' <span class="mut">· '+esc(String(s.note).slice(0,40))+'</span>':'')+'</td><td class="r num '+cls2(s.r)+'">'+(s.r==null?'':lsgn(s.r)+'R')+'</td></tr>'}).join('');
  h+=rows?'<div class="scroll" style="margin-top:8px"><table><tr><th>Seen (IST)</th><th>Instrument</th><th>Message</th><th>Outcome</th><th class="r">R</th></tr>'+rows+'</table></div>':'<div class="sub" style="margin-top:8px">No calls captured yet. Calls posted after the bot starts are picked up automatically; older posts are ignored on purpose.</div>';
  return h+'</div>';
}
function labPaint(){
  var d=LAB.d,el=$('#labroot');if(!d||!el)return;
  var ae=document.activeElement;if(ae&&ae.id==='tgtxt'&&ae.value){ /* keep typing intact */ var keep=ae.value;el.innerHTML=labStatus(d)+labCompare(d)+'<div id="labeq" class="card" style="margin-top:8px"><h2>Equity, % of start · '+MKT[LAB.mk]+'</h2><div class="lwc" data-h="220" id="labeqc"></div><div class="legend" id="labeqleg"></div></div><div style="margin-top:8px">'+labPositions(d)+'</div><div style="margin-top:8px">'+labScan(d)+'</div><div style="margin-top:8px">'+labLessons(d)+'</div><div style="margin-top:8px">'+labTg(d)+'</div><div style="margin-top:8px">'+labDecisions(d)+'</div>';var t=$('#tgtxt');if(t){t.value=keep;t.focus()}}
  else el.innerHTML=labStatus(d)+labCompare(d)+'<div id="labeq" class="card" style="margin-top:8px"><h2>Equity, % of start · '+MKT[LAB.mk]+'</h2><div class="lwc" data-h="220" id="labeqc"></div><div class="legend" id="labeqleg"></div></div><div style="margin-top:8px">'+labPositions(d)+'</div><div style="margin-top:8px">'+labScan(d)+'</div><div style="margin-top:8px">'+labLessons(d)+'</div><div style="margin-top:8px">'+labTg(d)+'</div><div style="margin-top:8px">'+labDecisions(d)+'</div>';
  labEquity(d);
}
var labEq=null;
function labEquity(d){
  var host=$('#labeqc');if(!host||!LW)return;if(labEq){try{labEq.remove()}catch(e){}labEq=null}
  var chart=LW.createChart(host,{width:Math.max(260,host.clientWidth),height:220,layout:{background:{type:'solid',color:'transparent'},textColor:cssv('--ink2'),fontSize:11,attributionLogo:true},grid:{vertLines:{color:cssv('--grid')},horzLines:{color:cssv('--grid')}},rightPriceScale:{borderColor:cssv('--line')},timeScale:{borderColor:cssv('--line'),timeVisible:true,secondsVisible:false}});labEq=chart;
  var any=false,leg='';
  d.bots.forEach(function(b){var c=d.curves[b.id][LAB.mk]||[],st=d.cfg.books[LAB.mk];leg+='<span><i style="border-color:'+BOTCOL[b.id]+'"></i>'+esc(b.id)+' '+esc(b.name)+'</span>';
    var pts=[],last=0;c.forEach(function(p){var t=p[0]+19800;if(t>last){pts.push({time:t,value:(p[1]/st-1)*100});last=t}});
    if(pts.length>1){any=true;var s=chart.addSeries(LW.LineSeries,{color:BOTCOL[b.id],lineWidth:2,priceLineVisible:false,lastValueVisible:true,priceFormat:{type:'custom',formatter:function(v){return v.toFixed(2)+'%'}}});s.setData(pts)}});
  $('#labeqleg').innerHTML=leg+(any?'':'<span class="mut">curves appear after the first 15-minute marks</span>');
  chart.timeScale().fitContent();
}
/* ---------- Charts tab ---------- */
function emaArr(cs,n){var k=2/(n+1),e=null,out=[];cs.forEach(function(c){e=e==null?c.close:c.close*k+e*(1-k);out.push({time:c.time,value:e})});return out}
var chObj=null;
function chLoad(force){
  var C=LAB.ch;if(C.busy)return;C.busy=true;
  fetch('/api/candles?sym='+encodeURIComponent(C.sym)+'&tf='+C.tf,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){C.busy=false;if(j.error){C.err=j.error;C.data=null}else{C.err=null;C.data=j;C.at=Date.now()}if(ui.tab==='charts')chPaint(force)}).catch(function(e){C.busy=false;C.err=String(e);if(ui.tab==='charts')chPaint(false)});
}
function chPx(){
  if(Date.now()-LAB.pxAt<15000)return;LAB.pxAt=Date.now();
  fetch('/api/lab/prices',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){LAB.px=j;if(ui.tab==='charts')chStrip()}).catch(function(){});
}
function chStrip(){
  var el=$('#chstrip');if(!el||!LAB.px)return;
  el.innerHTML=LAB.px.map(function(q){if(q.err||q.price==null)return '<button class="chip'+(q.sym===LAB.ch.sym?' on':'')+'" data-chsym="'+esc(q.sym)+'">'+esc(q.name||q.sym)+' · n/a</button>';
    var c=q.cur==='₹'?'₹':(q.cur||''),chg=q.chg==null?null:q.chg*100;return '<button class="chip'+(q.sym===LAB.ch.sym?' on':'')+'" data-chsym="'+esc(q.sym)+'">'+esc(q.name||q.sym)+' <b class="num">'+c+(+q.price).toLocaleString('en-IN',{maximumFractionDigits:q.price<10?4:2})+'</b> <span class="'+cls2(chg)+'">'+(chg==null?'':lsgn(chg)+'%')+'</span></button>'}).join('');
}
function chScaffold(){
  var C=LAB.ch;
  $('#view').innerHTML='<div class="card"><div class="row"><h2>Live charts</h2><span class="sub" id="chinfo"></span></div><div id="chstrip" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px"></div>'+
   '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0"><span class="seg">'+['5m','15m','1h','1d'].map(function(t){return '<button data-chtf="'+t+'" class="'+(C.tf===t?'on':'')+'">'+t+'</button>'}).join('')+'</span><button id="chema" class="'+(C.ema?'on':'')+'">EMA 20/50</button><button id="chmk" class="'+(C.mk?'on':'')+'">Bot trades</button></div>'+
   '<div class="lwc" id="chhost" data-h="420" style="height:420px"></div><div class="legend"><span><i style="border-color:#2a78d6"></i>EMA 20</span><span><i style="border-color:#eb6834"></i>EMA 50</span><span>dashed: <b style="color:#d03b3b">stop</b> / <b style="color:#0ca30c">target</b> / entry of open bot trades</span><span>▲ long entry · ▼ short entry · ● exit (letter = bot A/B/C/D…)</span></div><div class="sub" style="margin-top:6px">Times are IST. Prices come from free feeds (Yahoo, Coinbase) and can lag a few minutes; India indices and stocks only move during NSE hours.</div></div>';
  chObj=null;chStrip();
}
function chPaint(force){
  var C=LAB.ch,host=$('#chhost');if(!host)return;if(!LW){host.innerHTML='<div class="sub">Chart library not loaded.</div>';return}
  if(!C.data){host.innerHTML='<div class="sub" style="padding:20px">'+(C.err?'Could not load '+esc(C.sym)+': '+esc(C.err):'Loading…')+'</div>';chObj=null;return}
  var key=C.sym+'|'+C.tf,sh=19800,step={'5m':300,'15m':900,'1h':3600,'1d':86400}[C.tf];
  var cs=C.data.candles.map(function(c){return {time:c.t+sh,open:c.o,high:c.h,low:c.l,close:c.c}}),vol=C.data.candles.map(function(c){return {time:c.t+sh,value:c.v||0,color:c.c>=c.o?'rgba(12,163,12,.35)':'rgba(208,59,59,.35)'}});
  if(!chObj||chObj.key!==key||force){
    host.innerHTML='';if(chObj){try{chObj.chart.remove()}catch(e){}}
    var chart=LW.createChart(host,{width:Math.max(260,host.clientWidth),height:420,layout:{background:{type:'solid',color:'transparent'},textColor:cssv('--ink2'),fontSize:11,attributionLogo:true},grid:{vertLines:{color:cssv('--grid')},horzLines:{color:cssv('--grid')}},rightPriceScale:{borderColor:cssv('--line')},timeScale:{borderColor:cssv('--line'),timeVisible:C.tf!=='1d',secondsVisible:false,rightOffset:5},crosshair:{mode:0}});
    var cd=chart.addSeries(LW.CandlestickSeries,{upColor:'#0ca30c',downColor:'#d03b3b',borderVisible:false,wickUpColor:'#0ca30c',wickDownColor:'#d03b3b'});
    var vs=chart.addSeries(LW.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'vol',lastValueVisible:false,priceLineVisible:false});chart.priceScale('vol').applyOptions({scaleMargins:{top:.82,bottom:0}});
    var e1=chart.addSeries(LW.LineSeries,{color:'#2a78d6',lineWidth:1,priceLineVisible:false,lastValueVisible:false}),e2=chart.addSeries(LW.LineSeries,{color:'#eb6834',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
    chObj={key:key,chart:chart,cd:cd,vs:vs,e1:e1,e2:e2,lines:[],mk:null,first:true};
  }
  var o=chObj;o.cd.setData(cs);o.vs.setData(vol);
  if(C.ema){o.e1.setData(emaArr(cs,20));o.e2.setData(emaArr(cs,50))}else{o.e1.setData([]);o.e2.setData([])}
  o.lines.forEach(function(l){try{o.cd.removePriceLine(l)}catch(e){}});o.lines=[];
  (C.data.lines||[]).forEach(function(l){o.lines.push(o.cd.createPriceLine({price:l.px,color:l.kind==='stop'?'#d03b3b':l.kind==='target'?'#0ca30c':'#82827c',lineWidth:1,lineStyle:2,axisLabelVisible:false,title:''}))});
  var ms=[];if(C.mk){var first=cs.length?cs[0].time:0;(C.data.markers||[]).forEach(function(m){var t=Math.floor((m.t+sh)/step)*step;if(t<first)return;ms.push(m.kind==='in'?{time:t,position:m.side==='LONG'?'belowBar':'aboveBar',color:BOTCOL[m.bot]||'#888',shape:m.side==='LONG'?'arrowUp':'arrowDown',text:m.bot}:{time:t,position:'inBar',color:BOTCOL[m.bot]||'#888',shape:'circle',text:m.bot+(m.r!=null?' '+(m.r>0?'+':'')+m.r.toFixed(1)+'R':'')})})}
  ms.sort(function(a,b){return a.time-b.time});
  try{if(!o.mk)o.mk=LW.createSeriesMarkers(o.cd,ms);else o.mk.setMarkers(ms)}catch(e){}
  if(o.first){o.chart.timeScale().fitContent();o.chart.timeScale().setVisibleLogicalRange({from:Math.max(0,cs.length-110),to:cs.length+5});o.first=false}
  var li=cs.length?cs[cs.length-1]:null;$('#chinfo').textContent=(C.data.name||C.sym)+' · '+(C.data.open?'market open':'market closed')+' · '+(C.data.src||'')+' · updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
}
function labTab(){
  var cc=$('#ctrl');if(cc)cc.style.display=(ui.tab==='lab'||ui.tab==='charts')?'none':'';
  if(ui.tab==='lab'){
    if(!$('#labroot')){$('#view').innerHTML='<div id="labroot"><div class="card sub">Loading AI Lab…</div></div>';labFetch()}
    else if(Date.now()-LAB.at>10000)labFetch();
  }else if(ui.tab==='charts'){
    if(!$('#chhost')){chScaffold();chPx();chLoad(true)}
    else{chPx();if(Date.now()-LAB.ch.at>20000)chLoad(false)}
  }
}

  var t=e.target,b;
  if((b=t.closest('[data-labmk]'))){LAB.mk=b.getAttribute('data-labmk');labPaint();return}
  if((b=t.closest('[data-chsym]'))){LAB.ch.sym=b.getAttribute('data-chsym');LAB.ch.data=null;chStrip();chPaint(true);chLoad(true);return}
  if((b=t.closest('[data-chtf]'))){LAB.ch.tf=b.getAttribute('data-chtf');LAB.ch.data=null;[].forEach.call(document.querySelectorAll('[data-chtf]'),function(x){x.classList.toggle('on',x===b)});chPaint(true);chLoad(true);return}
  if(t.closest('#chema')){LAB.ch.ema=!LAB.ch.ema;$('#chema').classList.toggle('on',LAB.ch.ema);chPaint(false);return}
  if(t.closest('#chmk')){LAB.ch.mk=!LAB.ch.mk;$('#chmk').classList.toggle('on',LAB.ch.mk);chPaint(false);return}

  if((e.key==='k'&&(e.ctrlKey||e.metaKey))||(e.key==='/'&&!typing)){e.preventDefault();PRO.pal.open?palClose():palOpen();return}
  if(PRO.pal.open){var L=palItems();if(e.key==='Escape'){palClose()}else if(e.key==='ArrowDown'){e.preventDefault();PRO.pal.i=Math.min(L.length-1,PRO.pal.i+1);palPaint()}else if(e.key==='ArrowUp'){e.preventDefault();PRO.pal.i=Math.max(0,PRO.pal.i-1);palPaint()}else if(e.key==='Enter'){palRun(L[PRO.pal.i])}return}
  if(e.key==='Escape'){closeDrawer();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^[1-9]$/.test(e.key)){var t=TABS[+e.key-1];if(t)goTab(t[0])}else if(e.key==='t'||e.key==='T'){var b=$('#theme');if(b)b.click()}
});

/* ---------- clicks ---------- */
document.addEventListener('click',function(e){
  var t=e.target,b;
  if(t.closest('#pal')&&!t.closest('.box')){palClose();return}
  if((b=t.closest('#pall [data-pi]'))){palRun(palItems()[+b.getAttribute('data-pi')]);return}
  if(t.id==='drw'||t.closest('#drwx')){closeDrawer();return}
  if(t.closest('[data-more]')){PRO.more=true;drawer('<h3 style="margin:10px 0">All sections</h3>'+TABS.map(function(x){return '<button data-tab="'+x[0]+'" style="display:block;width:100%;text-align:left;margin:6px 0;padding:12px">'+TABICON[x[0]]+'  '+x[1]+'</button>'}).join('')+'<button id="palopen" style="display:block;width:100%;text-align:left;margin:6px 0;padding:12px">⌕  Search…</button>');return}
  if(t.closest('#palopen')){closeDrawer();palOpen();return}
  if((b=t.closest('[data-tab]'))&&$('#drw').classList.contains('on'))closeDrawer();
  if((b=t.closest('[data-goslot]'))){goSlot(b.getAttribute('data-goslot'));return}
  if((b=t.closest('[data-labmk2]'))){LAB.mk=b.getAttribute('data-labmk2');homePaint();return}
  if((b=t.closest('[data-btbook]'))){PRO.book=b.getAttribute('data-btbook');PRO.show=25;btPaint();return}
  if(t.closest('#btrun')){btRun();return}
  if(t.closest('#btmore')){PRO.show+=25;btPaint();return}
  if((b=t.closest('[data-btsort]'))){var k=b.getAttribute('data-btsort');if(PRO.sort===k)PRO.dir=-PRO.dir;else{PRO.sort=k;PRO.dir=-1}btPaint();return}
  if((b=t.closest('[data-vid]'))){variantDrawer(b.getAttribute('data-vid'));return}
  if((b=t.closest('[data-trade]'))){tradeDrawer(b.getAttribute('data-trade'));return}

  if(!F){el.innerHTML=h+'<div class="skel" style="height:120px"></div><div class="skel" style="height:160px;margin-top:8px"></div>';return}
  var lab=F.lab.filter(function(a){return mk==='ALL'||a.book===mk}),bk=F.books.filter(function(b){return mk==='ALL'||(SLOTMK[b.slot]||'IN')===mk});
  /* totals per currency: never mix rupees and dollars; practice replay is not live money */
  var T={};function tot(c){return T[c]||(T[c]={lab:{n:0,s:0,e:0},bk:{n:0,s:0,e:0}})}
  lab.forEach(function(a){var t=tot(a.currency).lab;t.n++;t.s+=a.start;t.e+=a.equity});
  bk.forEach(function(b){if(!b.ready||b.practice)return;var t=tot(b.currency).bk;t.n++;t.s+=b.start;t.e+=b.equity});
  h+='<div class="sect"><h3>Totals by currency</h3></div><div class="fgrid">';
  Object.keys(T).forEach(function(c){var t=T[c],all={s:t.lab.s+t.bk.s,e:t.lab.e+t.bk.e};
    var line=function(k,x){return x.n?frow(k+' · '+x.n+' account'+(x.n>1?'s':''),money(c,x.e)+'<small class="'+plCls(x.e-x.s)+'" style="display:block;font-weight:500">start '+money(c,x.s)+' · '+sgn(c,x.e-x.s)+'</small>'):''};
    h+='<div class="fa"><div class="h"><div class="t"><b>'+(c==='₹'?'Indian rupee ₹':'US dollar $')+'</b><small>separate pots that share no money</small></div><div class="e"><b class="'+plCls(all.e-all.s)+'">'+sgn(c,all.e-all.s)+'</b><small>net P&amp;L, all accounts</small></div></div>'+line('AI Lab bots',t.lab)+line('Paper books',t.bk)+frow('Combined now',money(c,all.e)+'<small style="display:block;font-weight:500;color:var(--ink2)">start '+money(c,all.s)+'</small>')+'</div>'});
  h+='</div>';
  /* AI Lab */
  ['CRYPTO','IN'].forEach(function(k){
    var L=lab.filter(function(a){return a.book===k});if(!L.length)return;var c=L[0].currency;
    h+='<div class="sect"><h3>AI Lab · '+(k==='CRYPTO'?'Crypto':'India')+' accounts</h3><span class="hint">'+money(c,L[0].start)+' each</span></div><div class="fgrid">';
    L.forEach(function(a){var pl=a.equity-a.start,over=a.exposure>1;
      h+='<div class="fa"><div class="h"><span class="av" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;background:'+(BOTCOL[a.bot]||'#555')+'">'+esc(a.bot)+'</span><div class="t"><b>'+esc(a.name)+'</b><small>its own money</small></div><div class="e"><b>'+money(c,a.equity)+'</b><small class="'+plCls(pl)+'">'+plPct(a.start?pl/a.start:0)+'</small></div></div>'+
        fgauge(a.exposure)+'<div class="hint" style="margin-bottom:4px">'+(a.open?money(c,a.notional)+' in '+a.open+' open trade'+(a.open>1?'s':'')+' · '+a.exposure.toFixed(2)+'× equity':'nothing in use')+'</div>'+
        frow('Start (set by '+a.env+')',money(c,a.start))+frow('Closed-trade P&amp;L, after fees',sgn(c,a.realized),plCls(a.realized))+frow('Open-trade P&amp;L',sgn(c,a.unrealized),plCls(a.unrealized))+frow('Fees paid',money(c,a.fees))+
        frow('Max loss if every open stop hits',money(c,a.riskAtStop)+(a.equity>0?' ('+(a.riskAtStop/a.equity*100).toFixed(1)+'%)':''))+frow('Open slots',a.open+' / '+a.maxPos)+frow('Closed trades',String(a.trades))+
        (over?'<span class="ftag w">exposure above 1× equity — the lab has no margin check</span>':'')+'</div>'});
    h+='</div>'});
  /* paper books */
  if(bk.length){h+='<div class="sect"><h3>Paper books · own engine, own cash</h3></div><div class="fgrid">';
    bk.forEach(function(b){
      if(!b.ready){h+='<div class="fa"><div class="h"><div class="t"><b>'+esc(slotShort(b.label))+'</b><small>not running yet · no balance to show</small></div></div></div>';return}
      var c=b.currency,use=b.equity>0?b.inPositions/b.equity:0;
      h+='<div class="fa"><div class="h"><div class="t"><b>'+esc(slotShort(b.label))+'</b><small>'+(b.practice?'practice replay · not live money':'its own cash')+(b.strategies?' · '+esc(b.strategies.join(', ')):'')+'</small></div><div class="e"><b>'+money(c,b.equity)+'</b><small class="'+plCls(b.pnl)+'">'+plPct(b.pnlPct)+'</small></div></div>'+
        fgauge(use)+'<div class="hint" style="margin-bottom:4px">'+(b.open?money(c,b.inPositions)+' in '+b.open+' position'+(b.open>1?'s':'')+' · '+(use*100).toFixed(0)+'% of equity':'nothing in use')+'</div>'+
        frow('Start'+(b.env?' (set by '+b.env+')':' (fixed in code)'),money(c,b.start))+frow('Free cash',money(c,b.cash))+frow('In open positions',money(c,b.inPositions))+frow('Closed-trade P&amp;L',sgn(c,b.realized),plCls(b.realized))+frow('Open-trade P&amp;L',sgn(c,b.unrealized),plCls(b.unrealized))+
        (b.fees!=null?frow('Fees paid',money(c,b.fees)):'')+frow('Open positions',b.open+(b.maxPositions?' / '+b.maxPositions:''))+frow('Closed trades',String(b.trades))+
        '<span class="ftag'+(b.restored?'':' w')+'">'+(b.restored?'balance restored from '+esc(b.restored)+' at boot':'started fresh at boot — no saved state was found')+'</span>'+(b.halted?'<span class="ftag w">halted by drawdown limit</span>':'')+'</div>'});
    h+='</div>'}
  h+='<div class="sect"><h3>How to read this</h3></div><div class="fnote">Every account is virtual paper money and trades only its own balance. AI Lab accounts and paper books are separate: the same BTC or Nifty move can appear in both, so do not add them as one pool. AI Lab sizes each trade by risk ('+(F.labCfg.riskPct!=null?(F.labCfg.riskPct*100).toFixed(1):'?')+'% of equity at the stop, up to '+(F.labCfg.maxNotional!=null?F.labCfg.maxNotional+'× equity':'?')+' per trade, '+(F.labCfg.maxPos||'?')+' slots) and does not deduct cash when a trade opens, so "in use" there is exposure, not spent money. Paper books do track cash. The start amount of each account comes from its setting on Render; changing it only takes effect for an account that starts fresh.</div>';
  if(el.__h===h&&el.firstElementChild)return;el.__h=h;el.innerHTML=h;
}
function fundsTab(){
  if(!$('#fundsroot')){$('#view').innerHTML='<div id="fundsroot"></div>';fundsPaint(true)}
  if(!PRO.fundsBusy&&Date.now()-(PRO.fundsAt||0)>6000){PRO.fundsBusy=true;jf('/api/funds').then(function(j){PRO.funds=j;PRO.fundsAt=Date.now();PRO.fundsBusy=false;if(ui.tab==='funds')fundsPaint()}).catch(function(){PRO.fundsBusy=false})}
}
/* a repaint while the page is being scrolled snaps the scroll offset back: hold it until the scroll stops */
var _labPaint=labPaint;labPaint=function(){if(scrolling()){DIRTY.lab=1;return}DIRTY.lab=0;_labPaint.apply(this,arguments)};
var _homePaint2=homePaint;homePaint=function(){if(scrolling()){DIRTY.home=1;return}DIRTY.home=0;_homePaint2.apply(this,arguments)};
window.addEventListener('click',function(){SCROLLAT=0},true);
window.addEventListener('change',function(){SCROLLAT=0},true);
setInterval(function(){if(scrolling())return;if(DIRTY.lab&&ui.tab==='lab')labPaint();if(DIRTY.home&&ui.tab==='home')homePaint();if(DIRTY.bots&&ui.tab==='bots')botsPaint();if(DIRTY.funds&&ui.tab==='funds')fundsPaint()},400);
try{if(!nseClock().open)LAB.mk='CRYPTO'}catch(e){}
APPREADY=true;(function(){var h=location.hash.slice(1);if(h&&TABS.some(function(t){return t[0]===h}))ui.tab=h})();renderTabs();try{render()}catch(e){}

renderTabs();renderCtrl();
if(SERVER)startServer();else startLocal();
if(SERVER)setInterval(function(){if(snap&&snap.server)renderCtrl()},5000);
var wait=setInterval(function(){if(snap){clearInterval(wait);render();setInterval(render,1000)}},120);
})();
</script>
