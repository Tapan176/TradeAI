services:
  - type: web
    name: paperbot
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SLOTS
        value: "nse,fno,instocks,gstocks,macro,india,crypto"
      - key: LEARNING
        value: "on"
      - key: CRYPTO_FEED
        value: coinbase
      - key: START_BALANCE_INDIA
        value: "10000"
      - key: START_BALANCE_CRYPTO
        value: "20"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SELF_URL
        sync: false
      # ---- AI Lab (all optional except the LLM key; set these in the Render dashboard, never in git) ----
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: VAULT_REPO
        sync: false
      - key: VAULT_TOKEN
        sync: false
      - key: TG_CHANNEL
        sync: false
      - key: LAB_SYMS
        value: "^NSEI,^NSEBANK,RELIANCE.NS,HDFCBANK.NS,BTC-USD,ETH-USD"
